<script>
/* ===== docparse.js ===== */
/* ==========================================================================
   Document text extraction: PDF, DOCX and legacy DOC.

   Everything here runs in the browser with no libraries. PDF FlateDecode is
   zlib, and a DOCX is a ZIP of raw-deflate entries, both of which the browser
   can already decompress natively via DecompressionStream. That is what makes
   this possible without shipping a megabyte of parser.

   The goal is honest text extraction. Where a file cannot be read (a scan with
   no text layer, a password-protected PDF, an old binary .doc), this reports
   why instead of returning plausible-looking nonsense.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------ helpers */

/** Byte-preserving string, so ASCII pattern scanning works on binary data. */
function latin1(bytes, from, to) {
  const a = from || 0, b = to === undefined ? bytes.length : to;
  let out = '';
  const CH = 8192;
  for (let i = a; i < b; i += CH) {
    out += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + CH, b)));
  }
  return out;
}

function bytesFromLatin1(s) {
  const u = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i) & 0xff;
  return u;
}

/* ---------------------------------------------------------------- limits ---
   These parsers read files the user did not write, so a malformed or hostile
   document must fail fast rather than freeze the tab. None of this is a memory
   safety concern (JavaScript has none to lose); it is purely about not hanging.
--------------------------------------------------------------------------- */

const MAX_FILE_BYTES = 25 * 1024 * 1024;      // 25 MB: far above any statement
const MAX_INFLATED_BYTES = 80 * 1024 * 1024;  // guards a decompression bomb
const PARSE_BUDGET_MS = 20000;                // whole-document wall clock

/** Throws once a parse has run too long, so every loop can be interrupted. */
function deadline(startedAt) {
  return () => {
    if (Date.now() - startedAt > PARSE_BUDGET_MS) {
      throw new Error('PARSE_TIMEOUT');
    }
  };
}

/**
 * Native inflate. `raw` selects ZIP-style raw deflate over zlib-wrapped.
 * Output is capped, because a small compressed payload can expand without
 * limit and exhaust memory.
 */
async function inflate(bytes, raw) {
  const fmt = raw ? 'deflate-raw' : 'deflate';
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream(fmt));
  const reader = stream.getReader();
  const chunks = [];
  let total = 0;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    total += value.length;
    if (total > MAX_INFLATED_BYTES) {
      reader.cancel();
      throw new Error('DECOMPRESSION_LIMIT');
    }
    chunks.push(value);
  }
  const out = new Uint8Array(total);
  let at = 0;
  for (const c of chunks) { out.set(c, at); at += c.length; }
  return out;
}

function decompressionSupported() {
  return typeof DecompressionStream !== 'undefined';
}

/* ============================================================== PDF ======= */

/** Every `N G obj` position in the file, so references can be resolved. */
function pdfIndexObjects(s) {
  const idx = {};
  const re = /(\d+)\s+(\d+)\s+obj\b/g;
  let m;
  while ((m = re.exec(s))) idx[+m[1]] = m.index + m[0].length;
  return idx;
}

/** The dictionary text of an object, plus its stream bounds if it has one. */
function pdfObjectAt(s, start) {
  if (start == null) return null;
  const endObj = s.indexOf('endobj', start);
  const stop = endObj < 0 ? s.length : endObj;
  const sm = s.indexOf('stream', start);
  let dictEnd = (sm >= 0 && sm < stop) ? sm : stop;
  const dict = s.slice(start, dictEnd);
  let data = null;
  if (sm >= 0 && sm < stop) {
    let p = sm + 6;
    if (s[p] === '\r') p++;
    if (s[p] === '\n') p++;
    let e = s.indexOf('endstream', p);
    if (e < 0) e = stop;
    // trim the EOL that precedes endstream
    let end = e;
    if (s[end - 1] === '\n') end--;
    if (s[end - 1] === '\r') end--;
    data = [p, end];
  }
  return { dict, data };
}

const pdfRef = (dict, key) => {
  const m = new RegExp('\\/' + key + '\\s+(\\d+)\\s+\\d+\\s+R').exec(dict);
  return m ? +m[1] : null;
};

/** Filters can be chained, e.g. /Filter [ /ASCII85Decode /FlateDecode ]. */
function parseFilters(dict) {
  const m = /\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/.exec(dict);
  if (!m) return [];
  return (m[1].match(/\/([A-Za-z0-9]+)/g) || []).map(x => x.slice(1));
}

/** ASCII85, the text-safe wrapper some writers put around compressed data. */
function ascii85Decode(bytes) {
  const out = [];
  let tuple = 0, count = 0;
  let i = 0;
  // optional <~ prefix
  if (bytes.length > 1 && bytes[0] === 0x3c && bytes[1] === 0x7e) i = 2;
  for (; i < bytes.length; i++) {
    const c = bytes[i];
    if (c === 0x7e) break;                       // ~> terminator
    if (c <= 0x20 || c === 0x0a || c === 0x0d) continue;
    if (c === 0x7a && count === 0) { out.push(0, 0, 0, 0); continue; }   // 'z'
    if (c < 0x21 || c > 0x75) continue;
    tuple = tuple * 85 + (c - 0x21);
    if (++count === 5) {
      out.push((tuple >>> 24) & 255, (tuple >>> 16) & 255, (tuple >>> 8) & 255, tuple & 255);
      tuple = 0; count = 0;
    }
  }
  if (count > 0) {
    for (let k = count; k < 5; k++) tuple = tuple * 85 + 84;
    const full = [(tuple >>> 24) & 255, (tuple >>> 16) & 255, (tuple >>> 8) & 255, tuple & 255];
    for (let k = 0; k < count - 1; k++) out.push(full[k]);
  }
  return new Uint8Array(out);
}

function asciiHexDecode(bytes) {
  const hex = latin1(bytes).replace(/[^0-9A-Fa-f]/g, '');
  const out = new Uint8Array(Math.floor(hex.length / 2));
  for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
  return out;
}

/** LZW as PDFs use it. Uncommon now, but old bank exports still contain it. */
function lzwDecode(bytes) {
  const out = [];
  const started = Date.now();
  let dict = [], bitBuf = 0, bitCount = 0, codeLen = 9, prev = null;
  const reset = () => {
    dict = [];
    for (let i = 0; i < 256; i++) dict[i] = [i];
    dict.length = 258;
    codeLen = 9; prev = null;
  };
  reset();
  for (let i = 0; i < bytes.length; i++) {
    bitBuf = (bitBuf << 8) | bytes[i];
    bitCount += 8;
    while (bitCount >= codeLen) {
      if (out.length > MAX_INFLATED_BYTES) throw new Error('DECOMPRESSION_LIMIT');
      if ((out.length & 0xffff) === 0 && Date.now() - started > PARSE_BUDGET_MS) {
        throw new Error('PARSE_TIMEOUT');
      }
      const code = (bitBuf >> (bitCount - codeLen)) & ((1 << codeLen) - 1);
      bitCount -= codeLen;
      if (code === 256) { reset(); continue; }
      if (code === 257) { bitCount = 0; i = bytes.length; break; }
      let entry;
      if (code < dict.length && dict[code]) entry = dict[code];
      else if (prev) entry = prev.concat(prev[0]);
      else return new Uint8Array(out);
      out.push.apply(out, entry);
      if (prev) dict.push(prev.concat(entry[0]));
      prev = entry;
      if (dict.length + 1 >= (1 << codeLen) && codeLen < 12) codeLen++;
    }
  }
  return new Uint8Array(out);
}

/** Decoded bytes of an object's stream, applying each filter in order. */
async function pdfStreamBytes(s, bytes, obj) {
  if (!obj || !obj.data) return null;
  let data = bytes.subarray(obj.data[0], obj.data[1]);
  for (const f of parseFilters(obj.dict)) {
    try {
      if (f === 'FlateDecode' || f === 'Fl') {
        try { data = await inflate(data, false); }
        catch (e) { data = await inflate(data.subarray(1), true); }
      } else if (f === 'ASCII85Decode' || f === 'A85') data = ascii85Decode(data);
      else if (f === 'ASCIIHexDecode' || f === 'AHx') data = asciiHexDecode(data);
      else if (f === 'LZWDecode' || f === 'LZW') data = lzwDecode(data);
      else if (f === 'RunLengthDecode' || f === 'RL') return null;
      else return null;                       // image codecs: nothing to read
    } catch (e) {
      // a bomb or a timeout must reach the caller, or the user gets told the
      // PDF simply has no text when in fact it was refused
      if (e && (e.message === 'DECOMPRESSION_LIMIT' || e.message === 'PARSE_TIMEOUT')) throw e;
      return null;
    }
    if (!data || !data.length) return null;
  }
  return data;
}

/**
 * Parses a /ToUnicode CMap into a code -> string map. This is what turns
 * font-internal glyph codes back into readable characters.
 */
function parseCMap(text) {
  const map = new Map();
  const hex = h => {
    let out = '';
    for (let i = 0; i + 3 < h.length + 1; i += 4) {
      const cp = parseInt(h.substr(i, 4), 16);
      if (!isNaN(cp)) out += String.fromCharCode(cp);
    }
    return out;
  };
  let m;
  const charRe = /beginbfchar([\s\S]*?)endbfchar/g;
  while ((m = charRe.exec(text))) {
    const pairs = m[1].match(/<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g) || [];
    for (const p of pairs) {
      const q = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/.exec(p);
      map.set(parseInt(q[1], 16), hex(q[2]));
    }
  }
  const rangeRe = /beginbfrange([\s\S]*?)endbfrange/g;
  while ((m = rangeRe.exec(text))) {
    const body = m[1];
    // <lo> <hi> <dst>
    const simple = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>/g;
    let r;
    while ((r = simple.exec(body))) {
      const lo = parseInt(r[1], 16), hi = parseInt(r[2], 16), dst = parseInt(r[3], 16);
      if (hi - lo > 65535) continue;
      for (let c = lo; c <= hi; c++) map.set(c, String.fromCharCode(dst + (c - lo)));
    }
    // <lo> <hi> [ <d1> <d2> ... ]
    const arr = /<([0-9A-Fa-f]+)>\s*<([0-9A-Fa-f]+)>\s*\[([\s\S]*?)\]/g;
    while ((r = arr.exec(body))) {
      const lo = parseInt(r[1], 16);
      const items = r[3].match(/<([0-9A-Fa-f]+)>/g) || [];
      items.forEach((it, i) => map.set(lo + i, hex(it.replace(/[<>]/g, ''))));
    }
  }
  return map;
}

/** Splits a PDF content stream into tokens we care about. */
function pdfTokens(src) {
  const toks = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === '%') { while (i < n && src[i] !== '\n') i++; continue; }
    if (c === '(') {
      let depth = 1, j = i + 1, out = '';
      while (j < n && depth > 0) {
        const ch = src[j];
        if (ch === '\\') {
          const nx = src[j + 1];
          const oct = /[0-7]/.test(nx) ? src.substr(j + 1, 3).match(/^[0-7]{1,3}/) : null;
          if (oct) { out += String.fromCharCode(parseInt(oct[0], 8)); j += 1 + oct[0].length; continue; }
          const esc = { n: '\n', r: '\r', t: '\t', b: '\b', f: '\f', '(': '(', ')': ')', '\\': '\\' }[nx];
          if (esc !== undefined) { out += esc; j += 2; continue; }
          if (nx === '\n') { j += 2; continue; }
          j += 2; continue;
        }
        if (ch === '(') { depth++; out += ch; j++; continue; }
        if (ch === ')') { depth--; if (depth > 0) out += ch; j++; continue; }
        out += ch; j++;
      }
      toks.push({ t: 'str', v: out }); i = j; continue;
    }
    if (c === '<' && src[i + 1] !== '<') {
      const e = src.indexOf('>', i);
      const h = src.slice(i + 1, e < 0 ? n : e).replace(/[^0-9A-Fa-f]/g, '');
      let out = '';
      for (let k = 0; k + 1 < h.length; k += 2) out += String.fromCharCode(parseInt(h.substr(k, 2), 16));
      if (h.length % 2) out += String.fromCharCode(parseInt(h[h.length - 1] + '0', 16));
      toks.push({ t: 'str', v: out }); i = (e < 0 ? n : e + 1); continue;
    }
    if (c === '<' && src[i + 1] === '<') { toks.push({ t: 'op', v: '<<' }); i += 2; continue; }
    if (c === '>' && src[i + 1] === '>') { toks.push({ t: 'op', v: '>>' }); i += 2; continue; }
    if (c === '[') { toks.push({ t: 'op', v: '[' }); i++; continue; }
    if (c === ']') { toks.push({ t: 'op', v: ']' }); i++; continue; }
    if (c === '/') {
      let j = i + 1;
      while (j < n && !/[\s\/\[\]<>()]/.test(src[j])) j++;
      toks.push({ t: 'name', v: src.slice(i + 1, j) }); i = j; continue;
    }
    if (/[-+.\d]/.test(c)) {
      let j = i;
      while (j < n && /[-+.\d]/.test(src[j])) j++;
      const num = parseFloat(src.slice(i, j));
      toks.push({ t: 'num', v: isNaN(num) ? 0 : num }); i = j; continue;
    }
    if (/\s/.test(c)) { i++; continue; }
    let j = i;
    while (j < n && !/[\s\/\[\]<>()%]/.test(src[j])) j++;
    if (j === i) j++;
    toks.push({ t: 'op', v: src.slice(i, j) }); i = j;
  }
  return toks;
}

/**
 * Walks a content stream and returns positioned text fragments. Position is
 * what lets rows and columns be reassembled, which a bank statement needs.
 */
function pdfTextItems(content, fonts) {
  const toks = pdfTokens(content);
  const items = [];
  let tm = [1, 0, 0, 1, 0, 0], tlm = tm.slice();
  let leading = 0, font = null, fsize = 10;
  const stack = [];

  const setTm = v => { tm = v.slice(); tlm = v.slice(); };
  const nextLine = (tx, ty) => {
    tlm = [tlm[0], tlm[1], tlm[2], tlm[3], tlm[0] * tx + tlm[2] * ty + tlm[4],
           tlm[1] * tx + tlm[3] * ty + tlm[5]];
    tm = tlm.slice();
  };
  const decode = raw => {
    if (!font) return raw;
    if (font.two) {
      let out = '';
      for (let i = 0; i + 1 < raw.length; i += 2) {
        const code = (raw.charCodeAt(i) << 8) | raw.charCodeAt(i + 1);
        out += font.map && font.map.has(code) ? font.map.get(code) : '';
      }
      return out;
    }
    if (font.map && font.map.size) {
      let out = '';
      for (let i = 0; i < raw.length; i++) {
        const c = raw.charCodeAt(i);
        out += font.map.has(c) ? font.map.get(c) : raw[i];
      }
      return out;
    }
    return raw;
  };
  const show = txt => {
    if (!txt) return;
    items.push({ x: tm[4], y: tm[5], size: Math.abs(tm[3] || fsize), text: txt });
    // advance roughly, so consecutive shows on one line do not stack
    tm[4] += txt.length * Math.abs(tm[0] || 1) * fsize * 0.5;
  };

  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (t.t !== 'op') { stack.push(t); continue; }
    const nums = () => stack.filter(x => x.t === 'num').map(x => x.v);
    switch (t.v) {
      case 'Tf': {
        const nm = stack.filter(x => x.t === 'name').pop();
        const sz = nums().pop();
        if (nm && fonts) font = fonts[nm.v] || null;
        if (sz) fsize = sz;
        break;
      }
      case 'Tm': { const a = nums(); if (a.length >= 6) setTm(a.slice(-6)); break; }
      case 'Td': { const a = nums(); if (a.length >= 2) nextLine(a[a.length - 2], a[a.length - 1]); break; }
      case 'TD': { const a = nums(); if (a.length >= 2) { leading = -a[a.length - 1]; nextLine(a[a.length - 2], a[a.length - 1]); } break; }
      case 'TL': { const a = nums(); if (a.length) leading = a[a.length - 1]; break; }
      case 'T*': nextLine(0, -leading); break;
      case 'BT': setTm([1, 0, 0, 1, 0, 0]); break;
      case 'Tj': { const s = stack.filter(x => x.t === 'str').pop(); if (s) show(decode(s.v)); break; }
      case "'": { nextLine(0, -leading); const s = stack.filter(x => x.t === 'str').pop(); if (s) show(decode(s.v)); break; }
      case '"': { nextLine(0, -leading); const s = stack.filter(x => x.t === 'str').pop(); if (s) show(decode(s.v)); break; }
      case 'TJ': {
        let out = '';
        for (const it of stack) {
          if (it.t === 'str') out += decode(it.v);
          // a large negative kern is how PDFs draw a space
          else if (it.t === 'num' && it.v < -120) out += ' ';
        }
        show(out);
        break;
      }
      default: break;
    }
    stack.length = 0;
  }
  return items;
}

/** Groups positioned fragments back into visual lines. */
function itemsToLines(items) {
  if (!items.length) return '';
  const rows = [];
  for (const it of items) {
    if (!it.text || !it.text.trim()) continue;
    const tol = Math.max(2, (it.size || 10) * 0.4);
    let row = rows.find(r => Math.abs(r.y - it.y) <= tol);
    if (!row) { row = { y: it.y, items: [] }; rows.push(row); }
    row.items.push(it);
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.items.sort((a, b) => a.x - b.x);
    let line = '', prevEnd = null;
    for (const it of r.items) {
      if (prevEnd !== null && it.x - prevEnd > (it.size || 10) * 0.28 && !/\s$/.test(line)) line += '  ';
      line += it.text;
      prevEnd = it.x + it.text.length * (it.size || 10) * 0.5;
    }
    return line.replace(/\s+$/, '');
  }).join('\n');
}

/** Reads a text-based PDF. Returns text plus why it failed, if it did. */
async function readPdf(buf) {
  try {
    return await readPdfInner(buf);
  } catch (e) {
    if (e && e.message === 'PARSE_TIMEOUT') {
      return { text: '', pages: 0, warnings: [],
        error: 'This PDF took too long to read and was stopped, which usually means it is very ' +
               'large or unusually structured. Download the statement as CSV instead.' };
    }
    if (e && e.message === 'DECOMPRESSION_LIMIT') {
      return { text: '', pages: 0, warnings: [],
        error: 'This PDF expands to an unreasonable size when decompressed and was rejected. ' +
               'Download the statement as CSV instead.' };
    }
    return { text: '', pages: 0, warnings: [],
      error: 'This PDF could not be read (' + (e && e.message ? e.message : 'unknown error') + ').' };
  }
}

async function readPdfInner(buf) {
  const bytes = new Uint8Array(buf);
  const s = latin1(bytes);
  const warnings = [];

  if (/\/Encrypt\b/.test(s)) {
    return { text: '', pages: 0, warnings: ['encrypted'],
      error: 'This PDF is password protected or encrypted, so its text cannot be read. ' +
             'Open it in your PDF reader, print it to a new PDF without the password, then import that.' };
  }

  const idx = pdfIndexObjects(s);
  const objAt = n => pdfObjectAt(s, idx[n]);

  // ---- fonts: map resource names to their ToUnicode maps, per page
  const fontCache = new Map();
  async function loadFont(num) {
    if (fontCache.has(num)) return fontCache.get(num);
    const o = objAt(num);
    let f = { two: false, map: null };
    if (o) {
      f.two = /\/Subtype\s*\/Type0/.test(o.dict) || /Identity-[HV]/.test(o.dict);
      const tu = pdfRef(o.dict, 'ToUnicode');
      if (tu != null) {
        const b = await pdfStreamBytes(s, bytes, objAt(tu));
        if (b) f.map = parseCMap(latin1(b));
      }
    }
    fontCache.set(num, f);
    return f;
  }
  async function fontsFor(resDict) {
    const out = {};
    if (!resDict) return out;
    const fm = /\/Font\s*<<([\s\S]*?)>>/.exec(resDict);
    let body = fm ? fm[1] : null;
    if (!body) {
      const ref = pdfRef(resDict, 'Font');
      if (ref != null) { const fo = objAt(ref); if (fo) body = fo.dict; }
    }
    if (!body) return out;
    const re = /\/([^\s\/]+)\s+(\d+)\s+\d+\s+R/g;
    let m;
    while ((m = re.exec(body))) out[m[1]] = await loadFont(+m[2]);
    return out;
  }

  // ---- pages, in document order
  const pageStarts = [];
  const pre = /\/Type\s*\/Page[^s]/g;
  let pm;
  while ((pm = pre.exec(s))) {
    const objStart = s.lastIndexOf(' obj', pm.index);
    if (objStart < 0) continue;
    pageStarts.push(objStart + 4);
  }

  const chunks = [];
  const checkTime = deadline(Date.now());
  for (const start of pageStarts) {
    checkTime();
    const o = pdfObjectAt(s, start);
    if (!o) continue;
    let res = null;
    const rm = /\/Resources\s*<<([\s\S]*?)>>\s*(?:\/|>>)/.exec(o.dict);
    if (rm) res = rm[0];
    else {
      const rr = pdfRef(o.dict, 'Resources');
      if (rr != null) { const ro = objAt(rr); if (ro) res = ro.dict; }
    }
    const fonts = await fontsFor(res);

    // /Contents may be one reference or an array of them
    let refs = [];
    const cr = pdfRef(o.dict, 'Contents');
    if (cr != null) refs = [cr];
    else {
      const am = /\/Contents\s*\[([^\]]*)\]/.exec(o.dict);
      if (am) refs = (am[1].match(/(\d+)\s+\d+\s+R/g) || []).map(x => parseInt(x, 10));
    }
    let content = '';
    for (const r of refs) {
      const b = await pdfStreamBytes(s, bytes, objAt(r));
      if (b) content += latin1(b) + '\n';
    }
    if (content) chunks.push(itemsToLines(pdfTextItems(content, fonts)));
  }

  // ---- fallback: no /Type /Page found, so decode every stream we can
  if (!chunks.length) {
    const seen = new Set();
    for (const num of Object.keys(idx)) {
      checkTime();
      const o = objAt(+num);
      if (!o || !o.data) continue;
      if (/\/Subtype\s*\/Image|\/Type\s*\/XObject/.test(o.dict) && !/\/Type\s*\/Page/.test(o.dict)) continue;
      const b = await pdfStreamBytes(s, bytes, o);
      if (!b) continue;
      const txt = latin1(b);
      if (!/BT[\s\S]*?ET|\bTJ\b|\bTj\b/.test(txt)) continue;
      const line = itemsToLines(pdfTextItems(txt, {}));
      if (line && !seen.has(line)) { seen.add(line); chunks.push(line); }
    }
    if (chunks.length) warnings.push('fallback');
  }

  // drop control bytes some PDF producers leave in the stream
  const text = chunks.join('\n\n')
    .split('').filter(c => c === '\n' || c === '\t' || c.charCodeAt(0) >= 32).join('');
  const printable = text.replace(/[^\x20-\x7e]/g, '').length;
  const pages = Math.max(pageStarts.length, chunks.length);

  if (!text.trim()) {
    return { text: '', pages, warnings,
      error: 'No text layer was found in this PDF. It is most likely a scan or a photo of a ' +
             'statement, which is an image rather than text. Download the statement again ' +
             'choosing CSV, or a PDF that you can select text in.' };
  }
  if (printable < text.length * 0.55) {
    return { text, pages, warnings,
      error: 'This PDF uses an embedded font this reader cannot map back to readable characters. ' +
             'Try downloading the statement as CSV instead.' };
  }
  return { text, pages, warnings, error: null };
}

/* ============================================================= DOCX ======= */

/** Minimal ZIP reader: locates an entry by name and inflates it. */
async function zipEntry(bytes, wanted) {
  const s = latin1(bytes);
  // End of Central Directory, searched from the tail
  let eocd = s.lastIndexOf('PK\x05\x06');
  if (eocd < 0) return null;
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);

  for (let i = 0; i < count; i++) {
    if (s.substr(off, 4) !== 'PK\x01\x02') break;
    const method = dv.getUint16(off + 10, true);
    const compSize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const local = dv.getUint32(off + 42, true);
    const name = s.substr(off + 46, nameLen);
    if (name === wanted) {
      const lNameLen = dv.getUint16(local + 26, true);
      const lExtraLen = dv.getUint16(local + 28, true);
      const dataStart = local + 30 + lNameLen + lExtraLen;
      const raw = bytes.subarray(dataStart, dataStart + compSize);
      if (method === 0) return raw;
      if (method === 8) return await inflate(raw, true);
      return null;
    }
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return null;
}

function xmlEntities(s) {
  return s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
    .replace(/&apos;/g, "'").replace(/&#x([0-9A-Fa-f]+);/g, (x, h) => String.fromCharCode(parseInt(h, 16)))
    .replace(/&#(\d+);/g, (x, d) => String.fromCharCode(+d))
    .replace(/&amp;/g, '&');
}

/** All the text inside one fragment, with runs joined and tabs preserved. */
function docxRunText(frag) {
  const parts = [];
  const re = /<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>|<w:tab\b[^>]*\/>/g;
  let m;
  while ((m = re.exec(frag))) parts.push(m[1] !== undefined ? xmlEntities(m[1]) : ' ');
  return parts.join('').replace(/\s+/g, ' ').trim();
}

/**
 * Turns WordprocessingML into plain lines. Table rows have to be handled
 * first and whole: every cell contains its own paragraph, so treating
 * paragraph ends as line breaks would put each cell on a separate line and
 * destroy the row structure a statement depends on.
 */
function docxXmlToText(xml) {
  // sentinels that cannot occur in document text, so later passes cannot eat them
  const NL = String.fromCharCode(1), TAB = String.fromCharCode(2);
  let s = xml;

  s = s.replace(/<w:tr[\s>][\s\S]*?<\/w:tr>/g, tr => {
    const cells = (tr.match(/<w:tc[\s>][\s\S]*?<\/w:tc>/g) || []).map(docxRunText);
    return NL + cells.join(TAB) + NL;
  });
  s = s.replace(/<w:p\b(?:\s[^>]*)?>[\s\S]*?<\/w:p>/g, p =>
    NL + docxRunText(p.replace(/<w:br\b[^>]*\/>/g, '</w:t>' + NL + '<w:t>')) + NL);
  s = s.replace(/<[^>]+>/g, '');

  const lines = s.split(NL).map(l => l.split(TAB).join('\t').replace(/[ \t]+$/, ''));
  const out = [];
  for (const l of lines) {
    const t = l.replace(/^\s+/, '');
    if (!t.trim() && (!out.length || !out[out.length - 1].trim())) continue;
    out.push(t);
  }
  return out.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

async function readDocx(buf) {
  const bytes = new Uint8Array(buf);
  let doc;
  try {
    doc = await zipEntry(bytes, 'word/document.xml');
  } catch (e) {
    return { text: '', warnings: [],
      error: e && e.message === 'DECOMPRESSION_LIMIT'
        ? 'This Word file expands to an unreasonable size when decompressed and was rejected.'
        : 'This Word file could not be opened (' + (e && e.message ? e.message : 'unknown') + ').' };
  }
  if (!doc) {
    return { text: '', warnings: [],
      error: 'This does not look like a Word .docx file. If it is an older .doc, open it in Word ' +
             'and use Save As to make a .docx, then try again.' };
  }
  const xml = new TextDecoder('utf-8').decode(doc);
  const text = docxXmlToText(xml);
  if (!text.trim()) {
    return { text: '', warnings: [], error: 'This Word file has no readable text in it.' };
  }
  return { text, warnings: [], error: null };
}

/* ============================================================== DOC ======= */

/**
 * Legacy binary .doc. A full reader means implementing the OLE compound file
 * format and Word's piece table, which is out of proportion here. This pulls
 * readable runs out of the raw bytes instead: usually enough to find dates and
 * amounts, sometimes messy. The UI says as much rather than pretending.
 */
async function readDoc(buf) {
  const bytes = new Uint8Array(buf);
  const head = latin1(bytes, 0, 8);
  if (head !== '\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1') {
    return { text: '', warnings: [],
      error: 'This does not look like a Word .doc file.' };
  }
  const runs = [];
  // UTF-16LE runs (how modern Word stores text inside .doc)
  let cur = '';
  for (let i = 0; i + 1 < bytes.length; i += 2) {
    const c = bytes[i] | (bytes[i + 1] << 8);
    if ((c >= 32 && c < 127) || c === 9) cur += String.fromCharCode(c);
    else if (c === 13 || c === 10) { cur += '\n'; }
    else { if (cur.replace(/\s/g, '').length >= 6) runs.push(cur); cur = ''; }
  }
  if (cur.replace(/\s/g, '').length >= 6) runs.push(cur);
  // single-byte runs, for older documents
  cur = '';
  const single = [];
  for (let i = 0; i < bytes.length; i++) {
    const c = bytes[i];
    if ((c >= 32 && c < 127) || c === 9) cur += String.fromCharCode(c);
    else if (c === 13 || c === 10) cur += '\n';
    else { if (cur.replace(/\s/g, '').length >= 12) single.push(cur); cur = ''; }
  }
  if (cur.replace(/\s/g, '').length >= 12) single.push(cur);

  const pick = runs.join('\n').length > single.join('\n').length / 3 ? runs : single;
  const text = pick.join('\n')
    .replace(/[ \t]{3,}/g, '  ')
    .replace(/\n{3,}/g, '\n\n')
    .split('\n')
    .filter(l => !/^[A-Za-z]:\\|Microsoft|Normal\.dot|Times New Roman|Calibri|MSWordDoc|Word\.Document/.test(l))
    .join('\n');

  if (!text.trim()) {
    return { text: '', warnings: [],
      error: 'No readable text could be pulled out of this .doc file. Open it in Word and use ' +
             'Save As to make a .docx or a PDF, then import that.' };
  }
  return { text, warnings: ['legacy-doc'], error: null };
}

/* ========================================================== dispatcher ==== */

const DOC_TYPES = '.pdf,.docx,.doc,.csv,.txt';

/** Reads any supported document and returns plain text plus any caveat. */
async function extractDocumentText(file) {
  if (!decompressionSupported()) {
    return { text: '', kind: null,
      error: 'This browser is too old to read PDF and Word files. Chrome, Edge or Firefox will work.' };
  }
  if (file.size > MAX_FILE_BYTES) {
    return { text: '', kind: null,
      error: `This file is ${(file.size / 1048576).toFixed(0)} MB, which is far larger than any ` +
             `statement and too large to read safely. Download the statement again as CSV, or ` +
             `export a single month at a time.` };
  }
  const name = (file.name || '').toLowerCase();
  const buf = await file.arrayBuffer();
  const bytes = new Uint8Array(buf);
  const sig = latin1(bytes, 0, 8);

  // trust the file's own signature over its extension
  let kind = null;
  if (sig.startsWith('%PDF')) kind = 'pdf';
  else if (sig.startsWith('PK\x03\x04')) kind = 'docx';
  else if (sig === '\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1') kind = 'doc';
  else if (name.endsWith('.pdf')) kind = 'pdf';
  else if (name.endsWith('.docx')) kind = 'docx';
  else if (name.endsWith('.doc')) kind = 'doc';
  else kind = 'text';

  let r;
  if (kind === 'pdf') r = await readPdf(buf);
  else if (kind === 'docx') r = await readDocx(buf);
  else if (kind === 'doc') r = await readDoc(buf);
  else r = { text: new TextDecoder('utf-8').decode(bytes), warnings: [], error: null };

  return { ...r, kind, name: file.name, size: file.size };
}

</script>
<script>
/* ===== extract.js ===== */
/* ==========================================================================
   Turning statement text into transactions and account fields.

   A PDF statement has no column headers to map, so this works by pattern:
   find the dated lines, find the money on them, and work out the sign. Where a
   running balance column exists it is used to verify the signs arithmetically,
   which is far more reliable than guessing from wording.

   Nothing here writes to the ledger. It produces a proposal that the user
   confirms, because silently editing someone's finances on a guess is not a
   feature.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------- money */

const MONTHS = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8,
                 sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };

/** Every money-looking token on a line, with position and sign markers. */
function findAmounts(line) {
  const out = [];
  const re = /(\()?\s*(?:\$|USD\s*)?(-)?\s*(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{2}))?\s*(\))?\s*(CR|DR)?/gi;
  let m;
  while ((m = re.exec(line))) {
    const whole = m[3].replace(/,/g, '');
    const cents = m[4];
    // a bare integer with no separators or decimals is usually not money
    if (!cents && !m[3].includes(',') && !m[1] && !m[2] && !/\$/.test(m[0])) continue;
    let v = parseFloat(whole + (cents ? '.' + cents : ''));
    if (!isFinite(v)) continue;
    if (v === 0 && !cents) continue;
    let neg = false;
    if (m[1] && m[5]) neg = true;                 // (123.45)
    if (m[2]) neg = true;                         // -123.45
    if (m[6] && m[6].toUpperCase() === 'DR') neg = true;
    let credit = m[6] && m[6].toUpperCase() === 'CR';
    out.push({ value: v, neg, credit, start: m.index, end: m.index + m[0].length, raw: m[0].trim() });
  }
  return out;
}

/** A date at or near the start of a line, in the shapes statements use. */
function findDate(line) {
  let m;
  if ((m = /^\s*(\d{4})-(\d{1,2})-(\d{1,2})\b/.exec(line)))
    return { y: +m[1], m: +m[2], d: +m[3], end: m[0].length, hadYear: true };
  if ((m = /^\s*(\d{1,2})[\/.-](\d{1,2})(?:[\/.-](\d{2,4}))?\b/.exec(line)))
    return { a: +m[1], b: +m[2], y: m[3] ? +m[3] : null, end: m[0].length, hadYear: !!m[3] };
  if ((m = /^\s*([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:,?\s*(\d{4}))?\b/.exec(line))) {
    const mo = MONTHS[m[1].slice(0, 4).toLowerCase()] || MONTHS[m[1].slice(0, 3).toLowerCase()];
    if (mo) return { m: mo, d: +m[2], y: m[3] ? +m[3] : null, end: m[0].length, hadYear: !!m[3] };
  }
  if ((m = /^\s*(\d{1,2})\s+([A-Za-z]{3,9})\.?(?:\s+(\d{4}))?\b/.exec(line))) {
    const mo = MONTHS[m[2].slice(0, 4).toLowerCase()] || MONTHS[m[2].slice(0, 3).toLowerCase()];
    if (mo) return { m: mo, d: +m[1], y: m[3] ? +m[3] : null, end: m[0].length, hadYear: !!m[3] };
  }
  return null;
}

/** Resolves a parsed date into ISO, filling in a missing year sensibly. */
function resolveDate(d, order, fallbackYear) {
  let mo, day;
  if (d.m !== undefined && d.a === undefined) { mo = d.m; day = d.d; }
  else {
    const a = d.a, b = d.b;
    if (a > 12) { day = a; mo = b; }
    else if (b > 12) { mo = a; day = b; }
    else if (order === 'dmy') { day = a; mo = b; }
    else { mo = a; day = b; }
  }
  let y = d.y;
  if (y == null) y = fallbackYear || new Date().getFullYear();
  else if (y < 100) y += y < 70 ? 2000 : 1900;
  if (mo < 1 || mo > 12 || day < 1 || day > 31) return null;
  return `${y}-${String(mo).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
}

/* ------------------------------------------------------- statement fields */

const grab = (text, patterns) => {
  for (const re of patterns) {
    const m = re.exec(text);
    if (m) {
      for (let i = 1; i < m.length; i++) if (m[i] !== undefined) return m[i];
    }
  }
  return null;
};
const num = v => {
  if (v == null) return null;
  const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
  return isFinite(n) ? n : null;
};

/**
 * Pulls the named values a statement states outright: limits, balances,
 * minimum payment, due date, APR. These map straight onto card fields.
 */
function findStatementFields(text) {
  const t = text.replace(/\r/g, '');
  const M = '[^\\n\\d$]{0,40}';                    // label to value gap
  const AMT = '\\$?\\s*([\\d,]+\\.\\d{2})';

  const f = {};
  // the optional parenthetical must not swallow digits, or it eats into the
  // amount itself and "$9,000.00" comes back as "0.00"
  f.creditLimit = num(grab(t, [
    new RegExp('(?:total\\s+)?credit\\s*(?:line|limit)(?:\\s*\\([^)\\n\\d$]{0,20}\\))?' + M + AMT, 'i'),
    new RegExp('credit\\s*line' + M + AMT, 'i'),
    new RegExp('revolving\\s+credit\\s+limit' + M + AMT, 'i')
  ]));
  f.availableCredit = num(grab(t, [
    new RegExp('available\\s*credit(?:\\s*line)?' + M + AMT, 'i')
  ]));
  f.statementBalance = num(grab(t, [
    new RegExp('new\\s+balance(?:\\s+total)?' + M + AMT, 'i'),
    new RegExp('statement\\s+balance' + M + AMT, 'i'),
    new RegExp('(?:^|\\n)\\s*balance\\s+due' + M + AMT, 'i'),
    new RegExp('closing\\s+balance' + M + AMT, 'i'),
    new RegExp('total\\s+amount\\s+due' + M + AMT, 'i')
  ]));
  f.minPayment = num(grab(t, [
    new RegExp('minimum\\s+payment\\s+due' + M + AMT, 'i'),
    new RegExp('minimum\\s+(?:amount\\s+)?due' + M + AMT, 'i'),
    new RegExp('min(?:imum)?\\.?\\s+payment' + M + AMT, 'i')
  ]));
  f.previousBalance = num(grab(t, [
    new RegExp('previous\\s+balance' + M + AMT, 'i'),
    new RegExp('(?:beginning|opening)\\s+balance' + M + AMT, 'i')
  ]));
  f.endingBalance = num(grab(t, [
    new RegExp('(?:ending|closing)\\s+balance' + M + AMT, 'i'),
    new RegExp('balance\\s+(?:as\\s+of|on)[^\\n]{0,30}' + AMT, 'i')
  ]));
  f.apr = num(grab(t, [
    /(?:purchase\s+)?annual\s+percentage\s+rate[^\n%]{0,40}?([\d.]+)\s*%/i,
    /\bAPR\b[^\n%]{0,40}?([\d.]+)\s*%/i,
    /([\d.]+)\s*%[^\n]{0,20}\bAPR\b/i
  ]));
  f.interestCharged = num(grab(t, [
    new RegExp('interest\\s+charge[sd]?' + M + AMT, 'i'),
    new RegExp('finance\\s+charge' + M + AMT, 'i')
  ]));
  f.fees = num(grab(t, [ new RegExp('(?:total\\s+)?fees\\s+charged' + M + AMT, 'i') ]));

  const dateStr = s => {
    if (!s) return null;
    const d = findDate(String(s).trim());
    return d ? resolveDate(d, 'mdy', null) : null;
  };
  const DATE = '([A-Za-z]{3,9}\\.?\\s+\\d{1,2},?\\s*\\d{0,4}|\\d{1,2}[\\/.-]\\d{1,2}[\\/.-]\\d{2,4}|\\d{4}-\\d{2}-\\d{2})';
  f.dueDate = dateStr(grab(t, [
    new RegExp('payment\\s+due\\s+date[^\\n\\w]{0,40}' + DATE, 'i'),
    new RegExp('due\\s+date[^\\n\\w]{0,40}' + DATE, 'i'),
    new RegExp('payment\\s+due[^\\n\\w]{0,40}' + DATE, 'i')
  ]));
  f.closingDate = dateStr(grab(t, [
    new RegExp('(?:statement\\s+)?closing\\s+date[^\\n\\w]{0,40}' + DATE, 'i'),
    new RegExp('statement\\s+(?:period\\s+)?(?:ending|closed?)[^\\n\\w]{0,40}' + DATE, 'i')
  ]));

  // statement period, which also gives us the year for dates that omit it
  const per = new RegExp(DATE + '\\s*(?:to|through|-|and)\\s*' + DATE, 'i').exec(t);
  if (per) {
    f.periodStart = dateStr(per[1]);
    f.periodEnd = dateStr(per[2]);
  }
  const acct = /(?:account|card)\s*(?:number|no\.?|#)?[^\n\d]{0,12}(?:[\dXx*]{2,}[\s-]*)?(\d{4})\b/i.exec(t);
  if (acct) f.accountLast4 = acct[1];

  // issuer, used only to suggest a card name
  const issuers = ['Chase', 'American Express', 'Amex', 'Capital One', 'Citi', 'Discover',
    'Bank of America', 'Wells Fargo', 'Barclays', 'Synchrony', 'US Bank', 'PNC', 'TD Bank', 'Apple Card'];
  f.issuer = issuers.find(i => new RegExp('\\b' + i.replace(/ /g, '\\s+') + '\\b', 'i').test(t)) || null;

  return f;
}

/** Is this a credit card statement, a bank statement, or something else? */
function classifyDocument(text, fields) {
  const t = text.toLowerCase();
  let card = 0, bank = 0;
  if (fields.creditLimit != null) card += 3;
  if (fields.minPayment != null) card += 3;
  if (fields.statementBalance != null) card += 1;
  if (/minimum payment|credit limit|available credit|payment due date/.test(t)) card += 2;
  if (/purchases and adjustments|cash advance|late payment warning/.test(t)) card += 2;
  if (/beginning balance|ending balance|deposits and additions|withdrawals/.test(t)) bank += 3;
  if (/checking|savings account|direct deposit|overdraft/.test(t)) bank += 2;
  if (card >= 4 && card >= bank) return 'card';
  if (bank >= 3) return 'bank';
  return 'unknown';
}

/* -------------------------------------------------------------- rows ----- */

const NOISE = /^(page\s*\d|continued|statement|account\s+summary|transaction\s+detail|date\s+description|balance\s+forward|total(s)?\b|previous\s+balance|new\s+balance|minimum\s+payment|payment\s+due|credit\s+limit|available\s+credit|interest\s+charge|annual\s+percentage|customer\s+service|visit\s+us|www\.|p\.?o\.?\s*box|questions\?)/i;

/**
 * Finds candidate transaction rows: a date, some text, and at least one amount.
 * Sign is left undecided here and settled by resolveSigns().
 */
function findTransactionRows(text, order, fallbackYear) {
  const rows = [];
  for (const rawLine of text.split('\n')) {
    const line = rawLine.replace(/\s+$/, '');
    if (!line.trim() || line.trim().length < 8) continue;
    if (NOISE.test(line.trim())) continue;

    const d = findDate(line);
    if (!d) continue;
    const iso = resolveDate(d, order, fallbackYear);
    if (!iso) continue;

    let rest = line.slice(d.end);
    // a second date (posting date) right after the first is not description
    const d2 = findDate(rest);
    if (d2 && d2.end <= 12) rest = rest.slice(d2.end);

    const amts = findAmounts(rest);
    if (!amts.length) continue;

    const desc = rest.slice(0, amts[0].start).replace(/\s{2,}/g, ' ').trim()
      .replace(/^[-\u2013\u2014\u2022|]\s*/, '').trim();
    if (!desc || desc.length < 2) continue;
    if (/^\d+$/.test(desc)) continue;

    rows.push({ date: iso, desc, amounts: amts, line });
  }
  return rows;
}

/**
 * Works out which column is the transaction amount and which is a running
 * balance, then derives signs from how the balance moves. When the balance
 * arithmetic checks out this is exact rather than a guess.
 */
function resolveSigns(rows, kind, openingBalance) {
  const multi = rows.filter(r => r.amounts.length >= 2);
  let usedBalance = false;

  if (multi.length >= 3) {
    // assume the last amount on each line is the running balance and test it
    let hits = 0, tested = 0;
    for (let i = 1; i < multi.length; i++) {
      const prev = multi[i - 1].amounts[multi[i - 1].amounts.length - 1].value;
      const cur = multi[i].amounts[multi[i].amounts.length - 1].value;
      const amt = multi[i].amounts[0].value;
      tested++;
      if (Math.abs(Math.abs(cur - prev) - amt) < 0.02) hits++;
    }
    if (tested && hits / tested >= 0.6) {
      usedBalance = true;
      for (let i = 0; i < multi.length; i++) {
        const r = multi[i];
        r.balance = r.amounts[r.amounts.length - 1].value;
        const amt = r.amounts[0].value;
        // the first row needs the statement's opening balance to be resolvable;
        // without it, leave the sign to the keyword pass rather than guessing
        const prev = i === 0
          ? (openingBalance != null ? openingBalance : null)
          : multi[i - 1].amounts[multi[i - 1].amounts.length - 1].value;
        if (prev == null) continue;
        const rose = (r.balance - prev) > 0;
        // on a credit card a rising balance means a purchase, so an expense
        const expense = kind === 'card' ? rose : !rose;
        r.value = expense ? -amt : amt;
        r.signKnown = true;
      }
    }
  }

  for (const r of rows) {
    if (r.value !== undefined) continue;
    const a = r.amounts[0];
    let v = a.value;
    let expense = true;
    if (a.credit) expense = false;
    else if (a.neg) expense = kind === 'card' ? false : true;
    else if (/\b(payment|deposit|credit|refund|reversal|interest earned|transfer from|direct dep|payroll|salary|cashback|rebate|thank you)\b/i.test(r.desc)) {
      expense = false;
    }
    // on a card statement a negative or CR amount is money coming off the balance
    r.value = expense ? -Math.abs(v) : Math.abs(v);
    r.signKnown = false;
  }
  return { usedBalance };
}

/* ------------------------------------------------------------ the pipeline */

/**
 * Full analysis of one document's text. Returns proposed transactions and
 * proposed field updates, with enough detail for the review screen to explain
 * where each number came from.
 */
function analyseStatement(text, opts) {
  opts = opts || {};
  const fields = findStatementFields(text);
  const kind = opts.kind || classifyDocument(text, fields);

  // year for dates printed without one
  let fallbackYear = null;
  for (const k of ['periodEnd', 'closingDate', 'periodStart', 'dueDate']) {
    if (fields[k]) { fallbackYear = +fields[k].slice(0, 4); break; }
  }

  // decide day/month order from the whole document before parsing rows
  const probe = [];
  for (const line of text.split('\n')) {
    const d = findDate(line);
    if (d && d.a !== undefined) probe.push(d);
  }
  let order = 'mdy';
  if (probe.some(d => d.a > 12) && !probe.some(d => d.b > 12)) order = 'dmy';
  if (opts.order) order = opts.order;

  let rows = findTransactionRows(text, order, fallbackYear);

  // a statement covering a period should not contain dates far outside it
  if (fields.periodStart && fields.periodEnd) {
    const lo = fields.periodStart, hi = fields.periodEnd;
    rows = rows.map(r => {
      if (r.date >= lo && r.date <= hi) return r;
      // a December row on a January statement belongs to the previous year
      const alt = String(+r.date.slice(0, 4) - 1) + r.date.slice(4);
      if (alt >= lo && alt <= hi) return { ...r, date: alt };
      return r;
    });
  }

  const sign = resolveSigns(rows, kind, fields.previousBalance);

  const txns = rows.map(r => {
    const t = {
      date: r.date,
      desc: r.desc.slice(0, 90),
      amount: Math.round(r.value * 100) / 100,
      signKnown: r.signKnown,
      balance: r.balance
    };
    // A payment landing ON a credit card is money moving between your own
    // accounts, not income. Counting it would inflate income and, if the
    // paying account is also imported, double-count the same money.
    t.transfer = kind === 'card' && t.amount > 0 &&
      /\b(payment|thank ?you|autopay|online payment|electronic payment|payment received|transfer)\b/i.test(t.desc);
    t.cat = t.amount > 0
      ? (autoCat(t.desc) === 'misc' ? 'income' : autoCat(t.desc))
      : autoCat(t.desc);
    if (t.transfer) t.cat = 'debt';
    else if (t.amount > 0 && bucketOf(t.cat) !== 'income' && kind !== 'card') t.cat = 'income';
    t.hash = txHash(t);
    return t;
  }).filter(t => t.amount !== 0);

  // arithmetic check: do the rows account for the balance movement?
  let reconciliation = null;
  if (fields.previousBalance != null && fields.statementBalance != null && txns.length) {
    const net = sum(txns.map(t => -t.amount));       // card balance grows with spend
    const expected = fields.statementBalance - fields.previousBalance;
    reconciliation = {
      expected, actual: net, diff: Math.round((net - expected) * 100) / 100,
      ok: Math.abs(net - expected) < 1.0
    };
  }

  const dates = txns.map(t => t.date).sort();
  return {
    kind, fields, txns, order,
    usedBalanceColumn: sign.usedBalance,
    reconciliation,
    span: dates.length ? [dates[0], dates[dates.length - 1]] : null,
    fallbackYear
  };
}

/** Card fields a statement can fill in, with the value it found for each. */
function proposedCardUpdates(a, card) {
  const f = a.fields;
  const out = [];
  const add = (key, label, value, fmt) => {
    if (value == null || value === '') return;
    const cur = card ? card[key] : null;
    const same = cur != null && String(cur) !== '' && Math.abs((+cur || 0) - (+value || 0)) < 0.005;
    out.push({ key, label, value, current: cur, same, fmt: fmt || (v => money2(v)) });
  };
  add('limit', 'Credit limit', f.creditLimit);
  add('statementBalance', 'Statement balance', f.statementBalance);
  add('balance', 'Balance', f.statementBalance);
  add('minPayment', 'Minimum payment', f.minPayment);
  add('apr', 'APR', f.apr, v => v + '%');
  if (f.dueDate) add('dueDay', 'Payment due day', +f.dueDate.slice(8, 10), v => 'day ' + v);
  if (f.closingDate) add('statementDay', 'Statement closes on day', +f.closingDate.slice(8, 10), v => 'day ' + v);
  return out;
}

</script>
<script>
/* ===== moments.js ===== */
/* ==========================================================================
   The moments layer.

   Numbers that count up, milestones that get acknowledged once, and the
   end-of-month recap. None of it changes a figure; all of it is about the
   difference between a report and something that notices you.

   Everything here is skipped outright when the reader has asked their system
   for less motion, and nothing here ever blocks an action.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------- count-up */

/**
 * Run a value up to its final figure.
 *
 * The point is to draw the eye to the number, not to make anyone wait for it,
 * so it is short and it starts near the answer rather than at zero: a run from
 * $0 to $2,938 reads as a slot machine, while a run from the previous month's
 * figure reads as a change. With no previous figure it starts at 82% of the
 * target, which is enough movement to notice and not enough to misinform.
 */
function countUp(el, to, fmt, from = null, ms = 560) {
  const start = from == null ? to * 0.82 : from;
  if (!isFinite(start) || !isFinite(to) || start === to) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const ease = p => 1 - Math.pow(1 - p, 3);     // fast out of the gate, settles
  function frame(now) {
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = fmt(start + (to - start) * ease(p));
    if (p < 1) requestAnimationFrame(frame);
    else el.textContent = fmt(to);              // never leave a rounded figure
  }
  requestAnimationFrame(frame);
}

const COUNT_FMT = {
  money: v => money(v),
  money2: v => money2(v),
  compact: v => compact(v),
  pct: v => pct(v, 1),
  pct0: v => pct(v, 0),
  int: v => String(Math.round(v))
};

/**
 * Animate the headline figures in a freshly rendered view.
 *
 * Only called when the destination or the month actually changed. Re-rendering
 * in place, which happens on every filter keystroke and every category change,
 * must not restart the animation: a number that keeps rolling while you type
 * is a distraction, not a flourish.
 */
function animateValues(scope) {
  if (REDUCED_MOTION.matches) return;
  for (const el of scope.querySelectorAll('[data-count]')) {
    const to = Number(el.dataset.count);
    const fmt = COUNT_FMT[el.dataset.fmt || 'money'];
    if (!isFinite(to) || !fmt) continue;
    const from = el.dataset.from === undefined ? null : Number(el.dataset.from);
    countUp(el, to, fmt, isFinite(from) ? from : null);
  }
}

/* ------------------------------------------------------------ milestones */

/**
 * Things worth acknowledging, each identified by a key so it is acknowledged
 * exactly once and never again.
 *
 * A milestone is a crossing, not a state. On the very first run every current
 * milestone is recorded silently, so opening the app for the first time with
 * three funded goals does not produce three congratulations for work that was
 * done before the app existed.
 */
function currentMilestones() {
  const out = [];

  for (const g of S.goals || []) {
    if (+g.target > 0 && +g.saved >= +g.target) {
      out.push({
        key: `goal:${g.id}`,
        title: `${g.name} is fully funded`,
        text: `${money(g.target)} set aside. You can mark it done, or point the money at the next thing.`
      });
    }
  }

  for (const c of S.cards || []) {
    if (c.active === false) continue;
    if (+c.limit > 0 && reportedBalance(c) === 0) {
      out.push({
        key: `card:${c.id}:clear`,
        title: `${c.name} is clear`,
        text: 'Nothing reported to the bureaus on this card. Keeping it open and unused is what helps ' +
              'your utilisation, so leave it be.'
      });
    }
  }

  // Only the month that has just ended, and only once it is genuinely over.
  const last = addMonths(thisMonth(), -1);
  const b = budgetSummary(last);
  if (b.anyBudgets && b.usedPct != null && b.usedPct <= 100 && monthStats(last, 'all').count > 0) {
    out.push({
      key: `budget:${last}`,
      title: `${monthLabel(last)} came in under budget`,
      text: `${money(b.budgetedSpend)} against ${money(b.totalBudget)} budgeted, ` +
            `which is ${money(b.totalBudget - b.budgetedSpend)} you did not have to spend.`
    });
  }

  return out;
}

/**
 * What has newly crossed since last time. Records as it reports, so a moment
 * is shown once and stays shown for the rest of that session only.
 */
function newMilestones() {
  const seen = (S.settings.milestones = S.settings.milestones || null);
  const now = currentMilestones();
  const keys = now.map(m => m.key);

  if (seen === null) {
    // first run: everything already true is history, not news
    S.settings.milestones = keys;
    save();
    return [];
  }
  const fresh = now.filter(m => !seen.includes(m.key));
  if (fresh.length) {
    // keys that are no longer true are dropped, so a goal that is emptied and
    // refunded is worth acknowledging again
    S.settings.milestones = keys;
    save();
  } else if (seen.length !== keys.length) {
    S.settings.milestones = keys;
    save();
  }
  return fresh;
}

/**
 * Milestones waiting to be shown on this screen.
 *
 * Session-scoped on purpose. A milestone is acknowledged in storage the moment
 * it is detected, so it can never be shown twice; this list is only what is
 * still on screen right now, and it empties as the reader dismisses items or
 * reloads the page.
 */
let MOMENTS_QUEUE = [];

/** Called once after the state is loaded, before the first render. */
function loadMoments() {
  try { MOMENTS_QUEUE = newMilestones(); }
  catch (e) { MOMENTS_QUEUE = []; }   // a flourish must never block the app
}

/** Markup for the moments waiting to be shown, or nothing at all. */
function momentsStrip() {
  const list = MOMENTS_QUEUE;
  if (!list.length) return '';
  return list.map(mo => `<div class="moment" data-moment="${esc(mo.key)}">
    <span class="moment-mark" aria-hidden="true">&#10003;</span>
    <div class="moment-b"><b>${esc(mo.title)}</b><span>${esc(mo.text)}</span></div>
    <button class="btn sm ghost moment-x" data-act="clear-moment" data-key="${esc(mo.key)}"
      aria-label="Dismiss: ${esc(mo.title)}">&times;</button>
  </div>`).join('');
}

/* --------------------------------------------------------- month recap */

/**
 * The month just ended, in one screen.
 *
 * Offered rather than imposed: it appears as a card on Home during the first
 * week of a new month and goes away once read or dismissed. A modal that
 * appeared on its own every first of the month would be an interruption.
 */
function recapAvailable() {
  const last = addMonths(thisMonth(), -1);
  if (+todayISO().slice(8, 10) > 8) return null;         // the moment has passed
  if ((S.settings.recapSeen || '') === last) return null;
  if (monthStats(last, 'all').count === 0) return null;  // nothing to recap
  return last;
}

function monthRecap(m) {
  const K = monthKpis(m, 'all');
  const b = budgetSummary(m);
  const prev = monthStats(addMonths(m, -1), 'all');
  const st = K.st;
  const cats = Object.entries(st.byCat)
    .filter(([id, v]) => v > 0 && bucketOf(id) !== 'income' && bucketOf(id) !== 'save')
    .sort((a, b2) => b2[1] - a[1]).slice(0, 3);

  const lines = [];
  if (K.savingsRate != null) {
    lines.push(K.savingsRate >= 20
      ? `You kept ${pct(K.savingsRate, 1)} of what came in, which is at or above the 20% benchmark.`
      : `You kept ${pct(K.savingsRate, 1)} of what came in. The benchmark most people aim at is 20%.`);
  }
  if (prev.count > 0) {
    const d = st.spend - prev.spend;
    lines.push(Math.abs(d) < 25
      ? 'You spent almost exactly what you spent the month before.'
      : `You spent ${money(Math.abs(d))} ${d < 0 ? 'less' : 'more'} than the month before.`);
  }
  if (b.anyBudgets && b.usedPct != null) {
    lines.push(b.usedPct <= 100
      ? `Your budgeted categories came in at ${pct(b.usedPct)} of plan.`
      : `Your budgeted categories ran to ${pct(b.usedPct)} of plan, with ${plural(b.over.length, 'category')} over.`);
  }
  if (st.invested > 0) lines.push(`${money(st.invested)} went into investments.`);

  openModal(`${monthLabel(m)}, closed`, `
    <div class="recap-hero">
      <div class="recap-n">${money(st.net)}</div>
      <div class="sub">left over after everything you spent and everything you set aside</div>
    </div>
    <div class="recap-grid">
      <div><span class="sub">Came in</span><b>${money(st.income)}</b></div>
      <div><span class="sub">Went out</span><b>${money(st.spend)}</b></div>
      <div><span class="sub">Set aside</span><b>${money(st.totalSaved)}</b></div>
      <div><span class="sub">Transactions</span><b>${st.count.toLocaleString('en-US')}</b></div>
    </div>
    ${lines.length ? `<ul class="recap-lines">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : ''}
    ${cats.length ? `<div class="sub" style="margin-top:16px">Where most of it went:
      ${cats.map(([id, v]) => `<b>${esc(catName(id))}</b> ${money(v)}`).join(' &middot; ')}</div>` : ''}
  `, `<button class="btn" data-act="go-month" data-m="${m}" data-close>Look at the month</button>
      <button class="btn primary" id="recapDone">Close the month</button>`,
    root => root.querySelector('#recapDone').onclick = () => {
      S.settings.recapSeen = m;
      save(); closeModal(); render();
      toast(`${monthLabel(m)} closed`);
    });
}

</script>
<script>
/* ===== views.js ===== */
/* ==========================================================================
   Views, forms and boot.
   ========================================================================== */
'use strict';

/**
 * Six destinations, each answering one question. Import and Settings are
 * housekeeping rather than places you visit to learn something, so they live
 * under the household name instead of competing with the six.
 * `icon` is only used by the bottom navigation on phones.
 */
const TABS = [
  ['home',   'Home',           '◎'],
  ['money',  'Money',          '≡'],
  ['budget', 'Budget',         '◔'],
  ['cards',  'Credit & Debt',  '▤'],
  ['wealth', 'Wealth',         '▲'],
  ['plan',   'Plan',           '⚑']
];
/** Reachable by routing but not shown as destinations. */
const SUB_VIEWS = ['import', 'settings'];
const ALL_VIEWS = TABS.map(t => t[0]).concat(SUB_VIEWS);

/* ------------------------------------------------------------------ routing */

/**
 * The URL is the state: `#/money/2026-09`. That makes every screen a link
 * worth sending, and makes the back button behave the way people expect
 * rather than leaving the app entirely.
 */
let ROUTING = false;

function readRoute() {
  const raw = (location.hash || '').replace(/^#\/?/, '');
  const [view, month] = raw.split('/');
  const out = {};
  if (view && ALL_VIEWS.includes(view)) out.tab = view;
  if (month && /^\d{4}-\d{2}$/.test(month)) out.month = month;
  return out;
}

function writeRoute(replace) {
  const hash = `#/${UI.tab}/${UI.month}`;
  if (location.hash === hash) return;
  ROUTING = true;                       // our own change, not a back button
  if (replace) history.replaceState(null, '', hash);
  else history.pushState(null, '', hash);
  ROUTING = false;
}

function applyRoute() {
  const r = readRoute();
  let changed = false;
  if (r.tab && r.tab !== UI.tab) { UI.tab = r.tab; changed = true; }
  if (r.month && r.month !== UI.month) { UI.month = r.month; changed = true; }
  if (changed) render(false);
}

/** Navigate, which means updating the URL and letting the route drive render. */
function go(tab, month) {
  if (tab) UI.tab = tab;
  if (month) UI.month = month;
  writeRoute(false);
  render(false);
  const main = $('#view');
  if (main) main.scrollIntoView({ block: 'start' });
  window.scrollTo(0, 0);
}

/* ------------------------------------------------------------ household menu */

/**
 * Settings, import and backups hang off the household name. They are things
 * you do to the app rather than places you go to learn something, so they do
 * not earn a slot next to the six destinations.
 */
function toggleHouseholdMenu(force) {
  const btn = $('#hhMenu'), panel = $('#hhMenuPanel');
  const open = force !== undefined ? force : panel.hidden;
  if (!open) {
    panel.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
    const scrim = $('#menuScrim');
    if (scrim) scrim.remove();
    return;
  }
  panel.innerHTML = `
    <div class="mlabel">${esc(S.household.name || 'Household')}</div>
    <button data-act="go-tab" data-tab="import"><span aria-hidden="true">&#8681;</span> Import a statement</button>
    <button data-act="export-json"><span aria-hidden="true">&#8659;</span> Download backup</button>
    <div class="sep"></div>
    <button data-act="go-tab" data-tab="settings"><span aria-hidden="true">&#9881;</span> Settings</button>
    <button data-act="run-setup"><span aria-hidden="true">&#9788;</span> Household and people</button>
    <div class="sep"></div>
    <button data-act="storage-info"><span aria-hidden="true">&#9974;</span> Storage and durability</button>
    <button data-act="about-sharing"><span aria-hidden="true">&#8599;</span> Share this dashboard</button>`;
  panel.hidden = false;
  btn.setAttribute('aria-expanded', 'true');

  const r = btn.getBoundingClientRect();
  panel.style.top = (r.bottom + 6) + 'px';
  panel.style.left = Math.max(8, Math.min(r.left, innerWidth - panel.offsetWidth - 8)) + 'px';

  const scrim = document.createElement('div');
  scrim.className = 'menu-scrim';
  scrim.id = 'menuScrim';
  scrim.onclick = () => toggleHouseholdMenu(false);
  document.body.appendChild(scrim);
  const first = panel.querySelector('button');
  if (first) first.focus();
}

/* ------------------------------------------------------------- small parts */

function tile(o) {
  // `count` is the figure behind the formatted string. Given it, the value can
  // run up to itself on arrival; without it the string is simply printed.
  const cnt = o.count == null ? ''
    : ` data-count="${o.count}" data-fmt="${o.fmt || 'money'}"` +
      (o.countFrom == null ? '' : ` data-from="${o.countFrom}"`);
  return `<div class="tile">
    <div class="lbl">${esc(o.label)}${o.help ? helpButton(o.help) : ''}</div>
    <div class="val${o.hero ? ' hero' : ''}"${o.tone ? ` style="color:${o.tone}"` : ''}${cnt}>${o.value}</div>
    ${o.delta ? `<div class="delta">${o.delta}</div>` : ''}
    ${o.spark ? `<div class="spark">${o.spark}</div>` : ''}
  </div>`;
}
function deltaBit(cur, prev, goodUp = true, fmt = money) {
  if (prev == null || !isFinite(prev) || prev === 0) return `<span class="flat">no prior month</span>`;
  const d = cur - prev, p = (d / Math.abs(prev)) * 100;
  const good = goodUp ? d >= 0 : d <= 0;
  const cls = Math.abs(p) < 0.5 ? 'flat' : good ? 'up' : 'down';
  const ar = d > 0 ? '▲' : d < 0 ? '▼' : '-';
  return `<span class="${cls}">${ar} <b>${fmt(Math.abs(d))}</b></span> vs last month`;
}
const toneVar = t => ({ good: 'var(--good)', warn: 'var(--warn)', serious: 'var(--serious)', crit: 'var(--crit)' }[t] || 'var(--accent)');
/**
 * The same status, at text weight.
 *
 * The bright status colours are built for fills, bars and borders, where a
 * large block of colour carries the meaning. As text they fall well under the
 * 4.5:1 minimum: amber on the page background measured 1.79:1. So anything
 * that says a status in words or figures uses these instead.
 */
const toneInk = t => ({ good: 'var(--good-ink)', warn: 'var(--warn-ink)',
  serious: 'var(--serious-ink)', crit: 'var(--crit-ink)' }[t] || 'var(--accent-ink)');
const toneIcon = t => ({ good: '✓', warn: '!', serious: '!', crit: '✕' }[t] || 'i');

function catOptions(sel) {
  return CATS.map(c => `<option value="${c.id}"${c.id === sel ? ' selected' : ''}>${esc(c.name)}</option>`).join('');
}
function memberOptions(sel, blank) {
  return (blank ? `<option value="">${esc(blank)}</option>` : '') +
    S.members.map(m => `<option value="${m.id}"${m.id === sel ? ' selected' : ''}>${esc(m.name)}</option>`).join('');
}
function accountOptions(sel, blank) {
  return (blank ? `<option value="">${esc(blank)}</option>` : '') +
    S.accounts.map(a => `<option value="${a.id}"${a.id === sel ? ' selected' : ''}>${esc(a.name)}</option>`).join('');
}
function emptyCard(title, body, btn) {
  return `<div class="card"><div class="empty"><h3>${esc(title)}</h3><p>${esc(body)}</p>${btn || ''}</div></div>`;
}

/* ============================================================== OVERVIEW === */

function viewOverview() {
  const m = UI.month;
  const st = monthStats(m);
  const K = monthKpis(m);
  const prevSt = monthStats(addMonths(m, -1));
  const hist = histMonths(m, 12);
  const histStats = hist.map(x => monthStats(x));

  // A month with nothing in it is an empty month, not a month of zeroes. Four
  // confident $0 tiles read as a report on the household rather than a gap.
  if (S.txns.length && !K.hasData) {
    const nearest = activeMonths();
    return `
    <div class="section-h"><h2>${esc(monthLabel(m))}</h2></div>
    ${emptyCard('Nothing recorded in ' + esc(monthLabel(m)),
      'No transactions fall in this month, so there is nothing to report. Use the arrows beside the month to move to one that has data.',
      nearest.length
        ? `<button class="btn primary" data-act="goto-month" data-m="${nearest[nearest.length - 1]}">Go to ${esc(monthLabel(nearest[nearest.length - 1]))}</button>
           <button class="btn" data-act="add-tx" style="margin-left:8px">Add a transaction</button>`
        : `<button class="btn primary" data-act="add-tx">Add a transaction</button>`)}`;
  }

  if (!S.txns.length) {
    return emptyCard('No transactions yet',
      'Import a bank or card statement, or add a transaction by hand, and this dashboard fills in.',
      `<button class="btn primary" data-act="import">Import a statement</button>
       <button class="btn" data-act="add-tx" style="margin-left:8px">Add a transaction</button>
       <button class="btn" data-act="load-sample" style="margin-left:8px">Load sample data</button>
       ${S.members.length ? '' : '<button class="btn" data-act="run-setup" style="margin-left:8px">Set up my household</button>'}`);
  }

  // ---- category ranking, top 8 with the tail folded into "Other"
  const catRows = Object.entries(st.byCat)
    .filter(([c]) => bucketOf(c) !== 'income' && bucketOf(c) !== 'save')
    .sort((a, b) => b[1] - a[1]);
  const top = catRows.slice(0, 8);
  const tail = catRows.slice(8);
  const catItems = top.map(([c, v]) => ({
    label: catName(c), value: v, color: 'var(--chart-ink)',
    sub: st.spend > 0 ? Math.round(v / st.spend * 100) + '%' : '',
    tip: ['Share of spending', st.spend > 0 ? pct(v / st.spend * 100, 1) : '-']
  }));
  if (tail.length) catItems.push({
    label: `Other (${tail.length})`, value: sum(tail.map(t => t[1])), color: 'var(--chart-ink)',
    sub: st.spend > 0 ? Math.round(sum(tail.map(t => t[1])) / st.spend * 100) + '%' : ''
  });

  // ---- per-member: colour follows the person, never their rank
  const memItems = S.members.map(mem => ({
    label: mem.name, value: st.byMember[mem.id] || 0, color: memberColor(mem.id),
    tip: ['Transactions', String(txForMonth(m, mem.id).filter(t => t.amount < 0).length)]
  })).filter(i => i.value > 0).sort((a, b) => b.value - a.value);
  const unassigned = st.byMember['none'] || 0;
  if (unassigned > 0) memItems.push({ label: 'Unassigned', value: unassigned, color: 'var(--muted)' });

  const merchants = topMerchants(m, 7);
  const anoms = categoryAnomalies(m).slice(0, 3);

  return `
  <div class="section-h"><h2>${esc(monthLabel(m))}</h2>
    <span class="sub">${plural(st.count, 'transaction')}${UI.member !== 'all' ? ' · ' + esc(memberName(UI.member)) : ' · whole household'}</span>
  </div>

  ${UI.member === 'all' ? `<p class="headline">${esc(headlineSentence(m))}</p>` : ''}

  ${UI.member === 'all' ? momentsStrip() : ''}
  ${UI.member === 'all' ? recapCard() : ''}

  ${UI.member === 'all' ? insightFeed(m) : ''}

  <div class="grid g-kpi">
    ${tile({
      label: 'Left over this month', hero: true, help: 'leftOver',
      value: money(st.net), count: st.net, countFrom: prevSt.count ? prevSt.net : null,
      tone: st.net >= 0 ? 'var(--good-ink)' : 'var(--crit-ink)',
      delta: deltaBit(st.net, prevSt.count ? prevSt.net : null, true),
      spark: chart({ type: 'spark', h: 34, values: histStats.map(s => s.net), color: 'var(--chart-ink)' })
    })}
    ${tile({
      label: 'Income', value: money(st.income), help: 'income',
      count: st.income, countFrom: prevSt.count ? prevSt.income : null,
      delta: deltaBit(st.income, prevSt.count ? prevSt.income : null, true),
      spark: chart({ type: 'spark', h: 34, values: histStats.map(s => s.income), color: 'var(--chart-ink)' })
    })}
    ${tile({
      label: 'Spending', value: money(st.spend), help: 'spending',
      count: st.spend, countFrom: prevSt.count ? prevSt.spend : null,
      delta: deltaBit(st.spend, prevSt.count ? prevSt.spend : null, false),
      spark: chart({ type: 'spark', h: 34, values: histStats.map(s => s.spend), color: 'var(--chart-ink)' })
    })}
    ${tile(K.savingsRate == null
      // no income means there is nothing to be a rate of, and "0.0%, below the
      // benchmark" would read as a verdict on a month that cannot have one
      ? { label: 'Savings rate', value: '-', help: 'savingsRate',
          delta: 'no income recorded this month' }
      : { label: 'Savings rate', value: pct(K.savingsRate, 1), help: 'savingsRate',
          count: K.savingsRate, fmt: 'pct',
          tone: K.savingsRate >= 20 ? 'var(--good-ink)' : K.savingsRate < 5 ? 'var(--crit-ink)' : '',
          delta: `<span class="${K.savingsRate >= 20 ? 'up' : 'flat'}">${K.savingsRate >= 20 ? 'at or above' : 'below'}</span> the 20% benchmark`,
          spark: chart({ type: 'spark', h: 34, values: histStats.map(s => s.rate), color: 'var(--chart-ink)' }) })}
  </div>

  <div class="grid g-2">
    <div class="panel">
      <h3>Income vs spending</h3><div class="sub">Last 12 months, household total</div>
      ${chart({
        type: 'line', h: 230, direct: true,
        x: hist.map(monthShort),
        tipTitle: i => monthLabel(hist[i]),
        series: [
          { name: 'Income', color: 'var(--chart-accent)', values: histStats.map(s => s.income), endLabel: compact(histStats.at(-1).income) },
          { name: 'Spending', color: 'var(--chart-ink)', values: histStats.map(s => s.spend), endLabel: compact(histStats.at(-1).spend) }
        ],
        aria: 'Monthly income and spending over the last twelve months'
      })}
      ${legend([{ name: 'Income', color: 'var(--chart-accent)' }, { name: 'Spending', color: 'var(--chart-ink)' }], 'swl')}
    </div>

    <div class="panel">
      <h3>Needs, wants and savings</h3>
      <div class="sub">The 50/30/20 guideline against your actual split</div>
      ${chart({
        type: 'stack', h: 34,
        segs: [
          { label: 'Needs', value: st.needs, color: 'var(--chart-ink)', on: 'var(--on-ink)' },
          { label: 'Wants', value: st.wants, color: 'var(--chart-ink-2)', on: 'var(--on-ink-2)' },
          { label: 'Saved', value: st.totalSaved, color: 'var(--chart-accent)', on: 'var(--on-accent)' }
        ], aria: 'Share of income going to needs, wants and savings'
      })}
      <div style="margin-top:12px">
        ${[['Needs', st.needs, 50, 'var(--chart-ink)'], ['Wants', st.wants, 30, 'var(--chart-ink-2)'], ['Saved', st.totalSaved, 20, 'var(--chart-accent)']]
          .map(([n, v, target, c]) => {
            const share = st.income > 0 ? (v / st.income) * 100 : 0;
            const ok = n === 'Saved' ? share >= target : share <= target;
            return `<div class="kv"><span><span class="dot" style="background:${c}"></span> ${n}
              <span class="sub"> guideline ${target}%</span></span>
              <b class="${ok ? 'pos' : ''}">${money(v)} · ${pct(share)}</b></div>`;
          }).join('')}
      </div>
      <div class="sub" style="margin-top:8px">Guideline only. High-cost housing markets routinely push needs past 50% - what matters is that the savings share keeps rising.</div>
    </div>
  </div>

  <div class="grid g-2">
    <div class="panel">
      <h3>Where the money went</h3><div class="sub">${esc(monthLabel(m))} · ranked by amount</div>
      ${catItems.length ? chart({ type: 'barh', items: catItems, rowH: 30, tipLabel: 'Spent',
        aria: 'Spending by category, ranked' }) : '<div class="sub">No spending recorded.</div>'}
    </div>
    <div class="panel">
      <h3>Spending by household member</h3>
      <div class="sub">Each person keeps the same colour everywhere</div>
      ${memItems.length ? chart({ type: 'barh', items: memItems, rowH: 32, tipLabel: 'Spent',
        aria: 'Spending by household member' })
        : `<div class="sub" style="padding:16px 0">No members set up yet. <button class="btn sm" data-act="go-settings">Add household members</button></div>`}
      ${memItems.length > 1 ? legend(memItems.map(i => ({ name: i.label, color: i.color }))) : ''}
    </div>
  </div>

  <div class="panel">
    <h3>Biggest merchants this month</h3><div class="sub">Grouped by merchant name</div>
    ${merchants.length ? `<table><tbody>${merchants.map(x => `
      <tr><td>${esc(merchantName(x.name))}<div class="sub">${esc(catName(x.cat))} · ${plural(x.n, 'charge')}</div></td>
      <td class="num"><b>${money(x.total)}</b></td></tr>`).join('')}</tbody></table>`
      : '<div class="sub">No spending recorded.</div>'}
  </div>

  ${anoms.length ? `<div class="panel">
    <h3>Worth a look</h3><div class="sub">Categories that moved against your recent norm</div>
    ${anoms.map(a => `<div class="insight">
      <div class="ic" style="background:${a.delta > 0 ? 'var(--warn)' : 'var(--good)'}">${a.delta > 0 ? '▲' : '▼'}</div>
      <div class="tx"><b>${esc(catName(a.cat))} ${a.delta > 0 ? 'up' : 'down'} ${money(Math.abs(a.delta))}</b>
      <span>${money(a.now)} this month vs a ${money(a.med)} median over the previous months.</span></div></div>`).join('')}
    <div style="margin-top:12px"><button class="btn sm" data-act="go-plan">See the full plan &rarr;</button></div>
  </div>` : ''}
  `;
}

/* ============================================================== SPENDING === */

/**
 * A collapsible section. Only the first section of a screen is open by
 * default; the rest show a one-line summary until asked for, which is what
 * keeps a long screen from arriving as a wall of equal cards.
 * The open set is remembered in settings so a choice survives a reload.
 */
function section(id, title, summary, body, openByDefault = false) {
  const store = (S.settings.openSections = S.settings.openSections || {});
  const open = store[id] === undefined ? openByDefault : store[id];
  return `<section class="sect${open ? ' open' : ''}" data-sect="${id}">
    <button class="sect-h" data-act="toggle-sect" data-id="${id}" aria-expanded="${open}"
            aria-controls="sect-body-${id}">
      <span class="sect-title">${esc(title)}</span>
      <span class="sect-sum">${summary}</span>
      <span class="sect-caret" aria-hidden="true">${open ? '&#9652;' : '&#9662;'}</span>
    </button>
    <div class="sect-b" id="sect-body-${id}"${open ? '' : ' hidden'}>${open ? body : ''}</div>
  </section>`;
}

/* ----------------------------------------------------------------- home --- */

/**
 * The month in a sentence, written from the data.
 *
 * A row of tiles makes the reader do the summarising. Saying it plainly is the
 * job the screen exists to do, so this leads and the numbers support it.
 */
function headlineSentence(m) {
  const K = monthKpis(m, 'all');
  const parts = [];

  if (K.leftOver != null) {
    parts.push(K.leftOver >= 0
      ? `You kept ${money(K.leftOver)} this month.`
      : `You spent ${money(-K.leftOver)} more than came in this month.`);
  }

  // the single most notable movement, if there is one worth naming
  const an = categoryAnomalies(m).filter(a => a.delta > 0)[0];
  if (an) {
    parts.push(an.isNew
      ? `${catName(an.cat)} is new this month.`
      : `${catName(an.cat)} is running hot.`);
  }

  // the next thing with a date on it
  const due = typeof upcomingPayments === 'function' ? upcomingPayments(10)[0] : null;
  if (due) {
    parts.push(due.daysToDue === 0
      ? `${due.card.name} is due today.`
      : `${due.card.name} is due in ${plural(due.daysToDue, 'day')}.`);
  }
  return parts.join(' ');
}

const insightKey = t => 'i:' + String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 48);

/**
 * An offer to look back at the month that just ended. It appears for the first
 * week of a new month and disappears the moment it is read or waved off, so it
 * is an invitation rather than a thing to get past.
 */
function recapCard() {
  const m = recapAvailable();
  if (!m) return '';
  return `<div class="card recap-offer">
    <div>
      <b>${esc(monthLabel(m))} is done</b>
      <div class="sub">A one-screen look at how the month went, then it is off your plate.</div>
    </div>
    <div class="recap-offer-a">
      <button class="btn ghost sm" data-act="skip-recap" data-m="${m}">Not now</button>
      <button class="btn primary sm" data-act="recap" data-m="${m}">See the recap</button>
    </div>
  </div>`;
}

/**
 * A paragraph that teaches rather than reports.
 *
 * The screen states what is true; this holds the reasoning for anyone who wants
 * it. Native <details> so it is keyboard-reachable and announced as expandable
 * without a line of script.
 */
function why(label, body) {
  return `<details class="disclosure"><summary>${esc(label)}</summary><div>${body}</div></details>`;
}

/** Insights, capped at three, each dismissible and remembered for the month. */
function insightFeed(m) {
  const dismissed = (S.settings.dismissed = S.settings.dismissed || {});
  const all = insights(m).filter(i => dismissed[insightKey(i.title)] !== m);
  const shown = all.slice(0, 3);

  if (!shown.length) {
    return `<div class="calm">
      <span class="calm-tick" aria-hidden="true">&#10003;</span>
      <div><b>Nothing needs your attention this month.</b>
      <span class="sub">Spending is in line with your recent months and no payment is close.</span></div>
    </div>`;
  }

  return `<div class="feed">
    ${shown.map(i => `
      <article class="feed-item">
        <span class="ic" style="background:${toneVar(i.tone)}" aria-hidden="true">${toneIcon(i.tone)}</span>
        <div class="feed-b">
          <b>${esc(i.title)}</b>
          <span class="sub">${esc(i.text)}</span>
        </div>
        <button class="btn sm ghost feed-x" data-act="dismiss-insight" data-k="${esc(insightKey(i.title))}"
          aria-label="Dismiss: ${esc(i.title)}">&times;</button>
      </article>`).join('')}
    ${all.length > shown.length
      ? `<button class="btn sm ghost" data-act="go-tab" data-tab="plan">
           ${all.length - shown.length} more on Plan &rarr;</button>` : ''}
  </div>`;
}

/** Money: what came in and went out, and what repeats every month. */
function viewMoney() {
  if (!S.txns.length) {
    return emptyCard('Nothing to show yet',
      'Import a bank or card statement, or add a transaction by hand, and everything fills in.',
      `<button class="btn primary" data-act="import">Import a statement</button>
       <button class="btn" data-act="add-tx" style="margin-left:8px">Add a transaction</button>`);
  }
  const st = monthStats(UI.month);
  const audit = subscriptionAudit();
  return `
  <div class="section-h"><h2>Money &middot; ${esc(monthLabel(UI.month))}</h2>

    `${st.count} this month &middot; ${money(st.spend)} out, ${money(st.income)} in`,

    audit.items.length

<script>
/* ===== charts.js ===== */
/* ==========================================================================
   Chart engine - dependency-free SVG.
   Charts are declared during render() as lightweight placeholders, then
   measured and drawn in mountCharts() so text stays crisp at any width.
   ========================================================================== */
'use strict';

const CHARTS = new Map();
let chartSeq = 0;

/** Declare a chart. Returns the placeholder HTML to drop into a template. */
function chart(spec) {
  const id = 'c' + (++chartSeq);
  CHARTS.set(id, spec);
  // The reservation stops the page jumping before the chart is measured and
  // drawn, so it has to be the height the chart will actually take. A ranked
  // bar chart knows that from its row count, and reserving a flat 200px left
  // a short one sitting in a pool of blank space.
  const h = spec.h || (spec.type === 'barh'
    ? spec.items.length * (spec.rowH || 30) + 6
    : 200);
  return `<div class="chartbox" data-chart="${id}" style="min-height:${h}px">
    <div class="tip" data-tip></div></div>`;
}

/** Measure every declared chart and draw it. Safe to call repeatedly. */
function mountCharts() {
  for (const box of $$('[data-chart]')) {
    const spec = CHARTS.get(box.dataset.chart);
    if (!spec) continue;
    const w = Math.max(240, box.clientWidth || 300);
    const tip = box.querySelector('[data-tip]');
    const svg = drawChart(spec, w);
    box.querySelectorAll('svg').forEach(n => n.remove());
    box.insertAdjacentHTML('afterbegin', svg);
    // the drawn chart is now the thing setting the height
    box.style.minHeight = '';
    wireHover(box, spec, tip, w);
  }
}

let _rz;
window.addEventListener('resize', () => {
  clearTimeout(_rz);
  _rz = setTimeout(mountCharts, 140);
});

/* ------------------------------------------------------------------- scales */

function niceTicks(min, max, want = 4) {
  if (min === max) { max = min + 1; }
  const span = max - min;
  const raw = span / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 1e6; v += step) out.push(Math.round(v * 1e6) / 1e6);
  return out;
}
const axisFmt = v => {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1).replace('.0', '') + 'M';
  if (a >= 1000) return (v / 1000).toFixed(a >= 10000 ? 0 : 1).replace('.0', '') + 'k';
  return String(Math.round(v));
};

/* -------------------------------------------------------------- dispatchers */

function drawChart(spec, w) {
  switch (spec.type) {
    case 'line':  return drawLine(spec, w);
    case 'barh':  return drawBarH(spec, w);
    case 'barv':  return drawBarV(spec, w);
    case 'stack': return drawStack(spec, w);
    case 'spark': return drawSpark(spec, w);
    case 'gauge': return drawGauge(spec, w);
    default: return '';
  }
}

/* --------------------------------------------------------------- line chart */
/* Multi-series time chart. One y-axis always - never a second scale. */

function drawLine(spec, w) {
  const h = spec.h || 220;
  const padT = 14, padB = 26, padL = 42, padR = spec.direct ? 56 : 12;
  const iw = w - padL - padR, ih = h - padT - padB;
  const xs = spec.x, n = xs.length;
  const all = spec.series.flatMap(s => s.values.filter(v => v != null));
  const lo = Math.min(0, ...all), hi = Math.max(...all, 1);
  const ticks = niceTicks(lo, hi, 4);
  const yMin = ticks[0], yMax = ticks[ticks.length - 1];
  const X = i => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
  const Y = v => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;

  let g = '';
  for (const t of ticks) {
    g += `<line class="gridline" x1="${padL}" x2="${padL + iw}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
          <text class="tick" x="${padL - 7}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${axisFmt(t)}</text>`;
  }
  // x labels: thin out so they never collide
  const every = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(iw / 52))));
  for (let i = 0; i < n; i++) {
    if (i % every && i !== n - 1) continue;
    g += `<text class="tick" x="${X(i).toFixed(1)}" y="${h - 8}" text-anchor="middle">${esc(xs[i])}</text>`;
  }

  let paths = '', ends = '';
  spec.series.forEach(s => {
    const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    if (s.area) {
      paths += `<path d="${d} L ${pts[pts.length - 1][0].toFixed(1)} ${Y(yMin).toFixed(1)} L ${pts[0][0].toFixed(1)} ${Y(yMin).toFixed(1)} Z"
                 fill="${s.color}" opacity=".10"/>`;
    }
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2"
               stroke-linejoin="round" stroke-linecap="round"${s.dash ? ' stroke-dasharray="5 4"' : ''}/>`;
    const last = pts[pts.length - 1];
    // one series means no legend is needed, so the endpoint carries the accent
    const endFill = spec.series.length === 1 ? 'var(--chart-accent)' : s.color;
    ends += `<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4.5" fill="${endFill}"
              stroke="var(--surface)" stroke-width="2"/>`;
    if (spec.direct) {
      ends += `<text class="dlabel" x="${(last[0] + 9).toFixed(1)}" y="${(last[1] + 4).toFixed(1)}">${esc(s.endLabel || axisFmt(s.values[s.values.length - 1]))}</text>`;
    }
  });

  const zero = (yMin < 0 && yMax > 0)
    ? `<line class="baseline" x1="${padL}" x2="${padL + iw}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}"/>` : '';

  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
            aria-label="${esc(spec.aria || 'line chart')}">
    ${g}${zero}${paths}${ends}
    <line data-cross class="baseline" x1="0" x2="0" y1="${padT}" y2="${padT + ih}" opacity="0"/>
    <g data-dots></g>
    <rect class="hit" data-hit x="${padL}" y="${padT}" width="${iw}" height="${ih}"/>
  </svg>`;
}

/* --------------------------------------------------- horizontal ranked bars */
/* One series -> one colour. Value labelled at the tip; never inside the bar. */

function drawBarH(spec, w) {
  const items = spec.items;
  if (!items.length) return `<div class="sub" style="padding:20px 0">No data for this period.</div>`;
  const rowH = spec.rowH || 30, barH = Math.min(18, rowH - 12);
  const h = items.length * rowH + 6;
  const labelW = Math.min(172, Math.max(88, Math.round(w * 0.34)));
  const valW = 74;
  const iw = Math.max(20, w - labelW - valW - 8);
  const max = Math.max(...items.map(i => Math.abs(i.value)), 1);
  const fmt = spec.fmt || (v => money(v));

  let out = '';
  items.forEach((it, i) => {
    const y = i * rowH + 4;
    const bw = Math.max(2, (Math.abs(it.value) / max) * iw);
    const c = it.color || 'var(--chart-ink)';
    out += `<text class="dlabel-2" x="0" y="${y + barH / 2 + 4}" >${esc(clip(it.label, labelW))}</text>`;
    out += `<g data-i="${i}" style="cursor:default">
      <rect x="${labelW}" y="${y}" width="${bw.toFixed(1)}" height="${barH}" rx="4" fill="${c}"/>
      <rect x="${labelW}" y="${y}" width="${Math.min(bw, 4).toFixed(1)}" height="${barH}" fill="${c}"/>
      <rect class="hit" x="0" y="${y - 5}" width="${w}" height="${rowH}"/>
    </g>`;
    out += `<text class="dlabel" x="${w}" y="${y + barH / 2 + 4}" text-anchor="end">${esc(fmt(it.value))}</text>`;
    if (it.sub) out += `<text class="tick" x="${labelW + bw + 7}" y="${y + barH / 2 + 4}">${esc(it.sub)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
    aria-label="${esc(spec.aria || 'ranked bar chart')}">${out}</svg>`;
}
function clip(s, px) {
  const max = Math.floor(px / 6.4);
  s = String(s);
  return s.length > max ? s.slice(0, max - 1) + '…' : s;
}

/* ---------------------------------------------------- vertical / diverging  */

function drawBarV(spec, w) {
  const h = spec.h || 190, padT = 14, padB = 24, padL = 42, padR = 8;
  const items = spec.items, n = items.length;
  const iw = w - padL - padR, ih = h - padT - padB;
  const vals = items.map(i => i.value);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals, 1), 4);
  const yMin = ticks[0], yMax = ticks[ticks.length - 1];
  const Y = v => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;
  const band = iw / n;
  const bw = Math.min(24, band - 6);

  let g = '';
  for (const t of ticks) {
    g += `<line class="gridline" x1="${padL}" x2="${padL + iw}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/>
          <text class="tick" x="${padL - 7}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${axisFmt(t)}</text>`;
  }
  const y0 = Y(0);
  g += `<line class="baseline" x1="${padL}" x2="${padL + iw}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}"/>`;

  let bars = '';
  items.forEach((it, i) => {
    const cx = padL + band * i + band / 2;
    const x = cx - bw / 2;
    const yv = Y(it.value);
    const top = Math.min(yv, y0), hgt = Math.max(1.5, Math.abs(yv - y0));
    const pos = it.value >= 0;
    const c = it.color || (pos ? 'var(--chart-ink)' : 'var(--crit)');
    // rounded at the data end, square at the baseline
    bars += `<g data-i="${i}">
      <path d="${roundedEnd(x, top, bw, hgt, pos)}" fill="${c}"/>
      <rect class="hit" x="${(cx - band / 2).toFixed(1)}" y="${padT}" width="${band.toFixed(1)}" height="${ih}"/>
    </g>`;
    const every = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(iw / 46))));
    if (i % every === 0 || i === n - 1)
      bars += `<text class="tick" x="${cx.toFixed(1)}" y="${h - 7}" text-anchor="middle">${esc(it.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
    aria-label="${esc(spec.aria || 'column chart')}">${g}${bars}</svg>`;
}
/** Bar path with a 4px rounded data-end and a square baseline end. */
function roundedEnd(x, y, w, h, up) {
  const r = Math.min(4, w / 2, h);
  return up
    ? `M${x} ${y + h} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h} Z`
    : `M${x} ${y} L${x + w} ${y} L${x + w} ${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} L${x + r} ${y + h} Q${x} ${y + h} ${x} ${y + h - r} Z`;
}

/* ------------------------------------------------- stacked composition bar  */
/* 2px surface gaps do the separating - never a stroke around a segment.      */

function drawStack(spec, w) {
  const h = spec.h || 54, barH = 28, gap = 2;
  const segs = spec.segs.filter(s => s.value > 0);
  const tot = sum(segs.map(s => s.value)) || 1;
  const avail = w - gap * Math.max(0, segs.length - 1);
  let x = 0, out = '';
  segs.forEach((s, i) => {
    const sw = (s.value / tot) * avail;
    const r = 4;
    out += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(1, sw).toFixed(1)}" height="${barH}"
             rx="${sw > 10 ? r : 1}" fill="${s.color}"/>`;
    // label inside only when it comfortably fits, otherwise it lives in the legend
    const txt = Math.round((s.value / tot) * 100) + '%';
    // a light segment cannot carry white text, so the label follows the fill
    const on = s.on || '#fff';
    if (sw > 42) out += `<text x="${(x + sw / 2).toFixed(1)}" y="${barH / 2 + 4.5}" text-anchor="middle"
        style="font-size:var(--t-xs);font-weight:640;fill:${on}">${txt}</text>`;
    x += sw + gap;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img"
    aria-label="${esc(spec.aria || 'composition bar')}">${out}</svg>`;
}

/* ------------------------------------------------------------- sparkline    */

function drawSpark(spec, w) {
  const h = spec.h || 34, v = spec.values;
  if (v.length < 2) return `<svg class="chart" height="${h}"></svg>`;
  const lo = Math.min(...v), hi = Math.max(...v);
  const X = i => (i / (v.length - 1)) * (w - 6) + 3;
  const Y = n => h - 4 - ((n - lo) / ((hi - lo) || 1)) * (h - 8);
  const d = v.map((n, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(n).toFixed(1)).join(' ');
  const c = spec.color || 'var(--chart-ink)';
  // the line is context; the accent is spent on the only point that is news
  const dot = spec.dot || 'var(--chart-accent)';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="${d} L${X(v.length - 1).toFixed(1)} ${h} L${X(0).toFixed(1)} ${h} Z" fill="${c}" opacity=".10"/>
    <path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(v.length - 1).toFixed(1)}" cy="${Y(v[v.length - 1]).toFixed(1)}" r="3.4"
      fill="${dot}" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

/* ------------------------------------------------------- score gauge (meter) */

function drawGauge(spec, w) {
  const size = Math.min(w, 150), r = size / 2 - 9, cx = size / 2, cy = size / 2;
  const val = clamp(spec.value, 0, 100);
  const C = 2 * Math.PI * r;
  const col = spec.color || (val >= 75 ? 'var(--good)' : val >= 50 ? 'var(--warn)' : val >= 30 ? 'var(--serious)' : 'var(--crit)');
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img"
      aria-label="Financial health score ${Math.round(val)} out of 100">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="10"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${(C * val / 100).toFixed(1)} ${C.toFixed(1)}"
      transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy + 2}" text-anchor="middle"
      style="font-family:var(--display);font-size:${spec.display && String(spec.display).length > 3 ? 20 : 28}px;font-weight:640;fill:var(--ink)"
      >${esc(spec.display != null ? spec.display : Math.round(val))}</text>
    <text x="${cx}" y="${cy + 20}" text-anchor="middle"
      style="font-size:13px;fill:var(--muted)">${esc(spec.sub != null ? spec.sub : 'out of 100')}</text>
  </svg>`;
}

/* ------------------------------------------------------------------- hover  */
/* Tooltips enhance; every value is also in a table view or a direct label.    */

function wireHover(box, spec, tip, w) {
  const svg = box.querySelector('svg');
  if (!svg || !tip) return;

  if (spec.type === 'line') {
    const hit = svg.querySelector('[data-hit]');
    const cross = svg.querySelector('[data-cross]');
    const dots = svg.querySelector('[data-dots]');
    if (!hit) return;
    const padL = 42, padR = spec.direct ? 56 : 12;
    const iw = w - padL - padR, n = spec.x.length;
    const h = spec.h || 220, padT = 14, padB = 26, ih = h - padT - padB;
    const all = spec.series.flatMap(s => s.values.filter(v => v != null));
    const ticks = niceTicks(Math.min(0, ...all), Math.max(...all, 1), 4);
    const yMin = ticks[0], yMax = ticks[ticks.length - 1];
    const Y = v => padT + ih - ((v - yMin) / (yMax - yMin || 1)) * ih;
    const X = i => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);

    const move = ev => {
      const r = svg.getBoundingClientRect();
      const px = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
      const sx = px * (w / r.width);
      const i = clamp(Math.round(((sx - padL) / (iw || 1)) * (n - 1)), 0, n - 1);
      cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i));
      cross.setAttribute('opacity', '.5');
      dots.innerHTML = spec.series.map(s => s.values[i] == null ? '' :
        `<circle cx="${X(i).toFixed(1)}" cy="${Y(s.values[i]).toFixed(1)}" r="4.5" fill="${s.color}"
          stroke="var(--surface)" stroke-width="2"/>`).join('');
      tip.innerHTML = `<div class="t">${esc(spec.tipTitle ? spec.tipTitle(i) : spec.x[i])}</div>` +
        spec.series.map(s => s.values[i] == null ? '' :
          `<div class="r"><span>${esc(s.name)}</span><b>${esc((spec.fmt || money)(s.values[i]))}</b></div>`).join('');
      tip.classList.add('on');
      tip.style.left = (X(i) / w * 100) + '%';
      tip.style.top = (Y(Math.max(...spec.series.map(s => s.values[i] || 0))) * (r.height / h)) + 'px';
    };
    const leave = () => { tip.classList.remove('on'); cross.setAttribute('opacity', '0'); dots.innerHTML = ''; };
    hit.addEventListener('mousemove', move);
    hit.addEventListener('touchmove', move, { passive: true });
    hit.addEventListener('mouseleave', leave);
    hit.addEventListener('touchend', leave);
  }

  if (spec.type === 'barh' || spec.type === 'barv') {
    const fmt = spec.fmt || money;
    svg.querySelectorAll('[data-i]').forEach(g => {
      const it = spec.items[+g.dataset.i];
      g.addEventListener('mousemove', ev => {
        const r = svg.getBoundingClientRect();
        tip.innerHTML = `<div class="t">${esc(it.label)}</div>
          <div class="r"><span>${esc(spec.tipLabel || 'Amount')}</span><b>${esc(fmt(it.value))}</b></div>` +
          (it.tip ? `<div class="r"><span>${esc(it.tip[0])}</span><b>${esc(it.tip[1])}</b></div>` : '');
        tip.classList.add('on');
        tip.style.left = (ev.clientX - r.left) + 'px';
        tip.style.top = (ev.clientY - r.top - 6) + 'px';
      });
      g.addEventListener('mouseleave', () => tip.classList.remove('on'));
    });
  }
}

/** Legend markup - always present when a chart carries two or more series. */
function legend(items, kind = 'sw') {
  return `<div class="legend">` + items.map(i =>
    `<span class="li"><span class="${kind}" style="background:${i.color}"></span>${esc(i.name)}</span>`
  ).join('') + `</div>`;
}

</script>
<script>
/* ===== metrics.js ===== */
/* ==========================================================================
   One definition per number.

   Every view reads its KPIs from here, so a figure cannot mean one thing on
   Overview and another on Plan. Each metric also carries whether it is
   available at all: a savings rate with no income, or a projection on the
   third of the month, are not small numbers but absent ones, and showing a
   confident 0.0% in their place is worse than showing nothing.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------- availability */

const hasMonthData = m => monthStats(m, 'all').count > 0;

/**
 * The month's headline figures, each with an explicit availability flag.
 * `null` means "cannot be computed", which callers must render as absent
 * rather than as zero.
 */
function monthKpis(m, member = UI.member) {
  const st = monthStats(m, member);
  const prevMonth = addMonths(m, -1);
  const prev = monthStats(prevMonth, member);

  const hasData = st.count > 0;
  const hasPrev = prev.count > 0;
  // a delta is only meaningful when both months actually contain something
  const canCompare = hasData && hasPrev;

  return {
    month: m, st, prev, hasData, hasPrev, canCompare,
    hasIncome: st.income > 0,

    leftOver: hasData ? st.net : null,
    income: hasData ? st.income : null,
    spending: hasData ? st.spend : null,
    saved: hasData ? st.totalSaved : null,
    // a savings rate needs income to be a rate of something
    savingsRate: st.income > 0 ? st.rate : null,
    investingRate: st.income > 0 ? (st.invested / st.income) * 100 : null,
    essentials: hasData ? st.needs : null,

    delta: key => {
      if (!canCompare) return null;
      const now = { leftOver: st.net, income: st.income, spending: st.spend,
                    saved: st.totalSaved }[key];
      const was = { leftOver: prev.net, income: prev.income, spending: prev.spend,
                    saved: prev.totalSaved }[key];
      if (now == null || was == null) return null;
      return now - was;
    }
  };
}

/* --------------------------------------------------------------- budgeting */

/**
 * Budgeted spending is compared against budgets. Spending in categories with
 * no budget is reported separately rather than folded into the same ratio,
 * which previously made a household look 181% over when it was at 91%.
 */
function budgetSummary(m) {
  const st = monthStats(m, 'all');
  const rows = CATS
    .filter(c => c.bucket !== 'income' && c.bucket !== 'save')
    .map(c => ({ c, spent: st.byCat[c.id] || 0, budget: +S.budgets[c.id] || 0 }))
    .filter(r => r.budget > 0 || r.spent > 0);

  const budgeted = rows.filter(r => r.budget > 0);
  const unbudgeted = rows.filter(r => r.budget <= 0 && r.spent > 0);
  const totalBudget = sum(budgeted.map(r => r.budget));
  const budgetedSpend = sum(budgeted.map(r => r.spent));

  return {
    rows, budgeted, unbudgeted,
    totalBudget,
    budgetedSpend,
    unbudgetedSpend: sum(unbudgeted.map(r => r.spent)),
    totalSpend: st.spend,
    over: budgeted.filter(r => r.spent > r.budget),
    usedPct: totalBudget > 0 ? (budgetedSpend / totalBudget) * 100 : null,
    anyBudgets: budgeted.length > 0
  };
}

/* -------------------------------------------------------------- projection */

/**
 * Month-end spending, projected honestly.
 *
 * The naive version extrapolates everything by how much of the month has
 * passed. That is badly wrong, because rent and the other declared bills are
 * paid in full early and are not a "pace". On the third of a month it produced
 * $55,369 against a real month of about $5,500.
 *
 * So: declared recurring items count at their known amounts exactly once, and
 * only the remaining variable spending is extrapolated. The result is a range,
 * because the honest answer is a range: the low end assumes nothing more is
 * spent, the expected end assumes the current variable pace continues.
 */
function monthProjection(m) {
  const dim = daysInMonth(m);
  const isCurrent = ym(todayISO()) === m;
  const dayNow = isCurrent ? +todayISO().slice(8, 10) : dim;
  const st = monthStats(m, 'all');

  const rec = (S.recurring || []).filter(r => r.active !== false);
  const declaredTotal = sum(rec.map(r => +r.amount || 0));
  const declaredDue = sum(rec.filter(r => (+r.day || 1) <= dayNow).map(r => +r.amount || 0));

  // Only spending that has actually happened can inform a pace. A ledger may
  // hold entries dated later in the month, and extrapolating those would count
  // them twice: once as recorded, once as predicted.
  const elapsedSpend = sum(
    txForMonth(m, 'all')
      .filter(t => t.amount < 0 && bucketOf(t.cat) !== 'save' && (+t.date.slice(8, 10)) <= dayNow)
      .map(t => -t.amount));

  // whatever has been spent beyond the bills already due is the variable part
  const variableSoFar = Math.max(0, elapsedSpend - declaredDue);
  const pace = dim > 0 ? dayNow / dim : 1;
  const variableProjected = pace > 0 ? variableSoFar / pace : variableSoFar;

  const low = declaredTotal + variableSoFar;
  const expected = declaredTotal + variableProjected;

  return {
    // too little of the month has passed for a pace to mean anything
    available: isCurrent && dayNow >= 10,
    reason: !isCurrent ? 'past' : dayNow < 10 ? 'early' : null,
    dayNow, dim, pace,
    declaredTotal, declaredDue, variableSoFar,
    low, expected,
    spentSoFar: elapsedSpend,
    monthTotalRecorded: st.spend,
    actual: isCurrent ? null : st.spend
  };
}

/* ------------------------------------------------------------ explanations */

/**
 * The "why" layer. Kept next to the maths so an explanation cannot drift away
 * from the calculation it describes.
 */
const METRIC_HELP = {
  leftOver: ['Left over this month',
    'Income minus everything spent, minus anything moved to savings or investments. ' +
    'It is what is still sitting in your accounts from this month, not a running balance.'],
  income: ['Income',
    'Every transaction categorised as Income, for the month shown. Refunds and ' +
    'reimbursements count here too, which is why it can differ from your salary.'],
  spending: ['Spending',
    'Everything that left your accounts except transfers into savings or investments, ' +
    'which are counted as money kept rather than money spent.'],
  savingsRate: ['Savings rate',
    'Money kept divided by income. Money kept is what you moved into savings and ' +
    'investments, plus anything you simply did not spend, because that stayed with you too. ' +
    'With no income for the month there is nothing to divide by, so no rate is shown.'],
  investingRate: ['Investing rate',
    'Transfers into the Investing category, divided by income. This is the line that ' +
    'builds long-term wealth, as distinct from cash savings.'],
  essentials: ['Essential spending',
    'Spending in the categories marked as needs: housing, utilities, groceries, transport, ' +
    'insurance, healthcare, childcare and debt payments. The emergency fund and ' +
    'financial independence targets are both multiples of this figure.'],
  projection: ['Projected month end',
    'Your declared recurring bills at their known amounts, counted once, plus the rest ' +
    'of your spending extrapolated from the pace so far. It is shown as a range because ' +
    'the low end assumes you spend nothing more and the upper end assumes the current ' +
    'pace continues. It appears from the tenth of the month, before which a pace is ' +
    'too noisy to mean anything.'],
  budgetUsed: ['Budget used',
    'Spending in categories that have a budget, divided by the total of those budgets. ' +
    'Categories with no budget are excluded from this ratio and reported separately, ' +
    'so an unbudgeted category cannot make you appear over budget.'],
  utilisation: ['Credit utilisation',
    'The balance reported to the credit bureaus divided by your credit limit, for each ' +
    'card and across all of them. The reported balance is the one on your statement, ' +
    'not the one showing today.'],
  healthScore: ['Financial health score',
    'Six weighted components: savings rate, emergency fund, debt burden, investing rate, ' +
    'budget adherence and spending stability. Each is scored against a published ' +
    'benchmark and the weights are shown beside them.']
};

/** Markup for the small "how is this calculated" affordance beside a KPI. */
function helpButton(key) {
  if (!METRIC_HELP[key]) return '';
  return `<button class="helpbtn" data-act="explain" data-key="${key}"
    aria-label="How is ${esc(METRIC_HELP[key][0])} calculated?" title="How is this calculated?">?</button>`;
}

</script>
<script>
/* ===== advisor.js ===== */
/* ==========================================================================
   Planning engine.

   Everything here is deterministic arithmetic over the household's own
   numbers, applied to widely published personal-finance frameworks
   (savings rate, emergency-fund months, the debt-avalanche method, the
   tax-advantaged funding order, the 4% / 25x rule, compound growth).
   It is educational modelling, not individualised investment advice, and
   it never names a security. See the disclaimer rendered on the Plan tab.
   ========================================================================== */
'use strict';

/* --------------------------------------------------------- health score ---- */

/** Linear ramp from `bad` to `good`, returning 0..1 (works in either direction). */
function ramp(v, bad, good) {
  if (good === bad) return v >= good ? 1 : 0;
  return clamp((v - bad) / (good - bad), 0, 1);
}

function healthScore() {
  const months = activeMonths();
  const inc = avgIncome(3), spd = avgSpend(3), ess = avgEssentials(3);

  // 1. Savings rate - share of income that stayed in the household
  const rates = months.slice(-3).map(m => monthStats(m, 'all').rate);
  const sr = rates.length ? sum(rates) / rates.length : 0;

  // 2. Emergency fund - months of essential spending held in cash
  const ef = ess > 0 ? cashAssets() / ess : (cashAssets() > 0 ? 6 : 0);

  // 3. Debt service burden - required non-mortgage payments vs income
  const dsr = inc > 0 ? (minDebtPayments() / inc) * 100 : 0;

  // 4. Investing rate - money actually moved into long-term assets
  const invs = months.slice(-3).map(m => monthStats(m, 'all').invested);
  const invRate = inc > 0 ? ((invs.length ? sum(invs) / invs.length : 0) / inc) * 100 : 0;

  // 5. Budget adherence - share of budgeted categories kept in line last month
  const last = months[months.length - 1];
  let within = 0, budgeted = 0;
  if (last) {
    const st = monthStats(last, 'all');
    for (const [cat, amt] of Object.entries(S.budgets)) {
      if (!amt) continue;
      budgeted++;
      if ((st.byCat[cat] || 0) <= amt) within++;
    }
  }
  const adherence = budgeted ? (within / budgeted) * 100 : 50;

  // 6. Spending stability - lower month-to-month variation is easier to plan around
  const spends = months.slice(-6).map(m => monthStats(m, 'all').spend).filter(x => x > 0);
  let cv = 0;
  if (spends.length >= 3) {
    const mu = sum(spends) / spends.length;
    const sd = Math.sqrt(sum(spends.map(x => (x - mu) ** 2)) / spends.length);
    cv = mu > 0 ? (sd / mu) * 100 : 0;
  }

  const comps = [
    { name: 'Savings rate', max: 25, v: sr, unit: '%', p: ramp(sr, 0, 20),
      why: 'Share of income kept each month. 20%+ is a strong target; every point compounds.' },
    { name: 'Emergency fund', max: 20, v: ef, unit: ' mo', dp: 1, p: ramp(ef, 0, 6),
      why: 'Cash on hand divided by essential monthly spending. 3-6 months is the usual range.' },
    { name: 'Debt burden', max: 15, v: dsr, unit: '%', invert: true, p: 1 - ramp(dsr, 0, 25),
      why: 'Required debt payments as a share of income. Under 15% keeps options open.' },
    { name: 'Investing rate', max: 20, v: invRate, unit: '%', p: ramp(invRate, 0, 15),
      why: 'Income routed into long-term assets. This is the line that builds wealth.' },
    { name: 'Budget adherence', max: 10, v: adherence, unit: '%', p: ramp(adherence, 20, 90),
      why: 'Budgeted categories you stayed inside last month.' },
    { name: 'Spending stability', max: 10, v: cv, unit: '% swing', invert: true, p: 1 - ramp(cv, 8, 45),
      why: 'How much monthly spending swings. Steadier spending makes planning reliable.' }
  ].map(c => ({ ...c, score: c.p * c.max }));

  const total = sum(comps.map(c => c.score));
  const band = total >= 80 ? ['Excellent', 'good'] : total >= 62 ? ['Solid', 'good']
    : total >= 45 ? ['Building', 'warn'] : total >= 28 ? ['Fragile', 'serious'] : ['At risk', 'crit'];

  return { total, comps, band, tone: band[1], ef, sr, dsr, invRate, adherence, cv, inc, spd, ess };
}

/* ------------------------------------------------------------ debt payoff -- */

/**
 * Month-by-month amortisation of every debt under one ordering strategy.
 * `extra` is the additional amount applied to the focus debt each month.
 */
function simulateDebt(order, extra) {
  // revolving card balances are debt too - the payoff order spans both lists
  const debts = allDebts().map(d => ({
    name: d.name, bal: +d.balance || 0, apr: (+d.apr || 0) / 100 / 12, min: +d.minPayment || 0
  })).filter(d => d.bal > 0);
  if (!debts.length) return { months: 0, interest: 0, order: [], payoff: [] };

  const sorted = [...debts].sort(order === 'avalanche'
    ? (a, b) => b.apr - a.apr
    : (a, b) => a.bal - b.bal);

  let month = 0, interest = 0;
  const payoff = [];
  const budget = sum(debts.map(d => d.min)) + extra;

  while (sorted.some(d => d.bal > 0.01) && month < 600) {
    month++;
    let pool = budget;
    // accrue interest, then pay minimums
    for (const d of sorted) {
      if (d.bal <= 0.01) continue;
      const i = d.bal * d.apr;
      interest += i; d.bal += i;
    }
    for (const d of sorted) {
      if (d.bal <= 0.01) continue;
      const pay = Math.min(d.min, d.bal, pool);
      d.bal -= pay; pool -= pay;
    }
    // everything left goes to the focus debt
    for (const d of sorted) {
      if (pool <= 0.01) break;
      if (d.bal <= 0.01) continue;
      const pay = Math.min(pool, d.bal);
      d.bal -= pay; pool -= pay;
    }
    for (const d of sorted) {
      if (d.bal <= 0.01 && !payoff.find(p => p.name === d.name)) {
        payoff.push({ name: d.name, month });
      }
    }
  }
  return { months: month, interest, order: sorted.map(d => d.name), payoff };
}

function debtPlans(extra) {
  return {
    avalanche: simulateDebt('avalanche', extra),
    snowball: simulateDebt('snowball', extra),
    minimum: simulateDebt('avalanche', 0)
  };
}

/* -------------------------------------------------------------- projections */

/** Future value of a monthly contribution plus a starting balance. */
function futureValue(monthly, years, annualPct, start = 0) {
  const r = annualPct / 100 / 12, n = years * 12;
  const fvStart = start * Math.pow(1 + r, n);
  const fvFlow = r === 0 ? monthly * n : monthly * ((Math.pow(1 + r, n) - 1) / r);
  return fvStart + fvFlow;
}

/** Years until invested assets cover 25x annual essential spending. */
function yearsToFI(monthly, annualPct, start, annualSpend) {
  if (annualSpend <= 0) return null;
  const target = annualSpend * 25;
  if (start >= target) return 0;
  if (monthly <= 0 && start <= 0) return null;
  const r = annualPct / 100 / 12;
  let bal = start;
  for (let m = 1; m <= 720; m++) {
    bal = bal * (1 + r) + monthly;
    if (bal >= target) return Math.round((m / 12) * 10) / 10;
  }
  return null;
}

function fiSnapshot() {
  const ess = avgEssentials(3);
  const annualEss = ess * 12;
  const st = S.settings;
  const months = activeMonths();
  const invMonthly = months.length
    ? sum(months.slice(-3).map(m => monthStats(m, 'all').invested)) / Math.min(3, months.length) : 0;
  const start = investAssets();
  const target = annualEss * 25;
  const yrs = yearsToFI(invMonthly, st.expectedReturn, start, annualEss);
  return {
    annualEss, target, start, invMonthly, yrs,
    age: st.currentAge, fiAge: yrs == null ? null : Math.round(st.currentAge + yrs),
    coverage: target > 0 ? clamp((start / target) * 100, 0, 100) : 0,
    safeDraw: start * 0.04 / 12
  };
}

/* ---------------------------------------------------- investable surplus --- */

/** What is genuinely free to invest each month right now. */
function investableSurplus() {
  const inc = avgIncome(3), spd = avgSpend(3);
  const already = activeMonths().length
    ? sum(activeMonths().slice(-3).map(m => monthStats(m, 'all').invested + monthStats(m, 'all').saved))
      / Math.min(3, activeMonths().length) : 0;
  return { free: Math.max(0, inc - spd - already), inc, spd, already };
}

/* -------------------------------------------------------- priority ladder -- */

/**
 * The standard order-of-operations for allocating spare cash. Each rung is
 * gated on the household's real figures, so the "you are here" marker moves
 * as the data changes.
 */
function ladder() {
  const h = healthScore();
  const st = S.settings;
  const ess = h.ess;
  const surplus = investableSurplus().free;
  const cash = cashAssets();
  const highRate = allDebts().filter(d => (+d.apr || 0) >= 8 && (+d.balance || 0) > 0);
  const highRateBal = sum(highRate.map(d => +d.balance || 0));
  const inc = h.inc;

  const rungs = [];
  const add = (title, done, body, metric, action) =>
    rungs.push({ title, done, body, metric, action });

  add('Know where the money goes',
    S.txns.length >= 40 && activeMonths().length >= 2,
    'A plan built on guessed numbers fails quietly. Two or more months of categorised transactions is the minimum base for everything below.',
    `${S.txns.length} transactions across ${plural(activeMonths().length, 'month')} loaded.`,
    'Import another statement on the Import tab.');

  add('Starter cash buffer of $2,000',
    cash >= 2000,
    'A small buffer stops an unexpected car repair from becoming credit-card debt at 20%+. This comes before investing because it protects everything after it.',
    cash >= 2000 ? `Cash on hand ${money(cash)} - buffer covered.`
      : `Cash on hand ${money(cash)}. ${money(2000 - cash)} to go.`,
    cash < 2000 && surplus > 0 ? `At your current ${money(surplus)}/mo surplus that is about ${plural(Math.ceil((2000 - cash) / surplus), 'month')} away.` : '');

  add('Capture the full employer retirement match',
    st.matchCaptured,
    `An employer match is an immediate, guaranteed return on your own contribution - typically the highest-return item on this list. Contribute at least enough to receive all of it.`,
    st.employerMatchPct > 0 && inc > 0
      ? `A ${st.employerMatchPct}% match on roughly ${money(inc * 12)}/yr household income is about ${money(inc * 12 * st.employerMatchPct / 100)}/yr you leave behind if unclaimed.`
      : 'Set your employer match percentage in Settings.',
    'Mark this done in Settings once payroll is contributing at least to the match.');

  add('Clear debt above ~8% APR',
    highRateBal === 0,
    'Paying down a 22% balance is a guaranteed 22% return. No ordinary investment offers that with certainty, which is why high-rate debt outranks investing here.',
    highRateBal > 0
      ? `${plural(highRate.length, 'debt')} above 8%, ${money(highRateBal)} total. Highest: ${highRate.sort((a, b) => b.apr - a.apr)[0].name} at ${highRate[0].apr}%.`
      : 'No debt above 8% APR. ',
    highRateBal > 0 ? 'Use the avalanche order on the Wealth tab - it minimises total interest.' : '');

  add('Emergency fund: 3-6 months of essentials',
    h.ef >= 3,
    'Essentials, not total spending - in a real emergency the discretionary half stops. Two earners with stable jobs can sit near 3 months; a single or variable income argues for 6.',
    ess > 0
      ? `${h.ef.toFixed(1)} months covered. Essentials run ${money(ess)}/mo, so 3 months is ${money(ess * 3)} and 6 months is ${money(ess * 6)}.`
      : 'Add cash accounts under Net Worth to measure this.',
    h.ef < 3 && surplus > 0 ? `About ${plural(Math.ceil((ess * 3 - cash) / surplus), 'month')} at your current surplus.` : '');

  add('Fund tax-advantaged accounts',
    h.invRate >= 10,
    st.hdhp
      ? 'With an HDHP, an HSA is the only account taxed nowhere - deductible going in, growing untaxed, and tax-free for qualified medical costs. Then an IRA, then the rest of the 401(k).'
      : 'After the match, an IRA and then the remainder of the 401(k) shelter growth from tax. Roth trades a deduction now for tax-free withdrawals later; traditional does the reverse.',
    `You are investing about ${pct(h.invRate, 1)} of income. 15% of gross is the common retirement benchmark.`,
    'Contribution limits change annually - check the current IRS figures before setting payroll amounts.');

  add('Invest the surplus in a taxable account',
    h.invRate >= 15 && h.ef >= 3,
    'Once sheltered space is used, a plain brokerage account has no contribution cap. This is also where medium-term goals live - money you may need before retirement age.',
    surplus > 0 ? `About ${money(surplus)}/mo is currently unallocated.`
      : 'No surplus detected yet - the Simulator below shows where one could come from.',
    'Broad diversification and low costs are the two levers you fully control.');

  add('Direct surplus at named goals',
    S.goals.length > 0 && S.goals.some(g => g.saved > 0),
    'Money with a name attached gets spent on purpose. House deposit, education, a sabbatical - each goal gets its own target date and horizon.',
    S.goals.length ? `${plural(S.goals.length, 'goal')} tracked, ${money(sum(S.goals.map(g => +g.saved || 0)))} set aside.`
      : 'No goals defined yet.',
    'Add goals on the Wealth tab.');

  // mark the first unfinished rung as the current focus
  const i = rungs.findIndex(r => !r.done);
  rungs.forEach((r, k) => { r.status = r.done ? 'done' : (k === i ? 'now' : 'next'); });
  return rungs;
}

/* -------------------------------------------------------------- insights --- */

/**
 * Category spend this month against the trailing median, biggest movers first.
 *
 * A change has to clear two bars to be worth saying out loud: large in money,
 * and large relative to what that category normally costs. The money bar scales
 * with income, because $60 means something different to different households.
 *
 * A category with no history has no median to be a percentage of. Treating its
 * first purchase as a 100% rise, which the previous version did, turned every
 * new merchant into an alert.
 */
function categoryAnomalies(m) {
  const prior = activeMonths().filter(x => x < m).slice(-3);
  if (prior.length < 2) return [];
  const st = monthStats(m, 'all');
  const cur = st.byCat;
  const floor = Math.max(45, st.income * 0.01);
  const out = [];
  for (const c of CATS) {
    if (c.bucket === 'income' || c.bucket === 'save') continue;
    const hist = prior.map(p => monthStats(p, 'all').byCat[c.id] || 0);
    const med = median(hist);
    const now = cur[c.id] || 0;
    const delta = now - med;
    if (Math.abs(delta) < floor) continue;

    if (med <= 0) {
      // new spending, not a spike: no percentage is computable or meaningful
      if (now >= floor * 2) out.push({ cat: c.id, now, med: 0, delta, rel: null, isNew: true });
      continue;
    }
    const rel = (delta / med) * 100;
    if (Math.abs(rel) >= 25) out.push({ cat: c.id, now, med, delta, rel, isNew: false });
  }
  return out.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
}

/** Recurring charges plus anything that looks like one in the transaction log. */
function subscriptionAudit() {
  const known = S.recurring.filter(r => r.active !== false).map(r => ({
    name: r.name, amount: +r.amount || 0, cat: r.cat, member: r.member, source: 'declared'
  }));
  // detect repeat charges of a near-identical amount to the same merchant
  const groups = {};
  for (const t of S.txns) {
    if (t.amount >= 0) continue;
    const key = normDesc(t.desc).split(' ').slice(0, 3).join(' ');
    if (!key) continue;
    (groups[key] = groups[key] || []).push(t);
  }
  // Categories where repeat visits are shopping, not a subscription. A household
  // buys groceries weekly at similar amounts, which otherwise looks identical to
  // a monthly charge and turned the grocery run into a "recurring commitment".
  const NEVER_SUBSCRIPTION = new Set(['groceries', 'dining', 'transport', 'fees']);

  const detected = [];
  for (const [key, list] of Object.entries(groups)) {
    if (list.length < 3) continue;
    const amts = list.map(t => -t.amount);
    const med = median(amts);
    if (med < 3) continue;
    if (NEVER_SUBSCRIPTION.has(list[0].cat)) continue;

    // a subscription bills at the same amount, so most charges must agree,
    // not merely three of however many there are
    const consistent = amts.filter(a => Math.abs(a - med) / (med || 1) < 0.1).length;
    if (consistent < 3 || consistent / amts.length < 0.8) continue;

    const monthsSeen = new Set(list.map(t => ym(t.date))).size;
    if (monthsSeen < 3) continue;

    // and it bills about once a month. Several charges inside one month is a
    // merchant you visit often, which is a different thing entirely.
    if (list.length / monthsSeen > 1.35) continue;

    if (known.some(k => normDesc(k.name).includes(key) || key.includes(normDesc(k.name).split(' ')[0]))) continue;
    detected.push({ name: list[0].desc, amount: med, cat: list[0].cat, member: list[0].member, source: 'detected', n: monthsSeen });
  }
  const all = [...known, ...detected].sort((a, b) => b.amount - a.amount);
  return { items: all, monthly: sum(all.map(a => a.amount)), annual: sum(all.map(a => a.amount)) * 12 };
}

function topMerchants(m, n = 8) {
  const map = {};
  for (const t of txForMonth(m)) {
    if (t.amount >= 0 || bucketOf(t.cat) === 'save') continue;
    const k = normDesc(t.desc).split(' ').slice(0, 3).join(' ').toUpperCase() || 'OTHER';
    map[k] = map[k] || { name: k, total: 0, n: 0, cat: t.cat };
    map[k].total += -t.amount; map[k].n++;
  }
  return Object.values(map).sort((a, b) => b.total - a.total).slice(0, n);
}

/** Everything the Plan tab surfaces as a one-line finding. */
function insights(m) {
  const out = [];
  const h = healthScore();
  const st = monthStats(m, 'all');
  const prior = activeMonths().filter(x => x < m).slice(-3);
  const subs = subscriptionAudit();
  const surplus = investableSurplus().free;

  if (st.income > 0 && st.rate < 0) {
    out.push(['crit', 'You spent more than you earned this month',
      `Outflows exceeded income by ${money(-st.net)}. If this repeats, it drains cash or grows a balance. Start with the largest movers below.`]);
  } else if (st.income > 0 && st.rate < 10) {
    out.push(['warn', `Savings rate is ${pct(st.rate, 1)}`,
      `Below the 10% floor most planning frameworks use. Lifting it to 20% would free about ${money(st.income * 0.2 - st.totalSaved)} more per month.`]);
  } else if (st.rate >= 20) {
    out.push(['good', `Savings rate is ${pct(st.rate, 1)}`,
      `At or above the 20% benchmark. Held for a year that is roughly ${money(st.totalSaved * 12)} added to your household.`]);
  }

  for (const a of categoryAnomalies(m).slice(0, 4)) {
    if (a.isNew) {
      out.push(['warn', `${money(a.now)} on ${catName(a.cat)}, which is new`,
        `Nothing was spent here in the last ${prior.length} months, so there is no normal to compare against yet.`]);
    } else {
      out.push([a.delta > 0 ? 'warn' : 'good',
        `${catName(a.cat)} ${a.delta > 0 ? 'up' : 'down'} ${pct(Math.abs(a.rel))} vs your recent norm`,
        `${money(a.now)} this month against a ${money(a.med)} median over the last ${prior.length} months, a ${a.delta > 0 ? 'rise' : 'drop'} of ${money(Math.abs(a.delta))}.`]);
    }
  }

  const fees = st.byCat.fees || 0;
  if (fees > 25) {
    out.push(['crit', `${money(fees)} lost to fees and interest charges`,
      `Fees are pure leakage - no goods received. ${money(fees * 12)} a year. Interest charges usually mean a balance is being carried; fees usually mean a rule can be changed.`]);
  }

  if (subs.monthly > 0) {
    const share = st.income > 0 ? (subs.monthly / st.income) * 100 : 0;
    out.push([share > 6 ? 'warn' : 'good', `${subs.items.length} recurring charges totalling ${money(subs.monthly)}/mo`,
      `${money(subs.annual)} a year, ${pct(share, 1)} of income. Recurring charges are the easiest category to cut because the decision is made once.`]);
  }

  if (h.ef < 3 && h.ess > 0) {
    out.push([h.ef < 1 ? 'crit' : 'warn', `Emergency fund covers ${h.ef.toFixed(1)} months`,
      `Essentials are ${money(h.ess)}/mo, so three months is ${money(h.ess * 3)}. You are ${money(Math.max(0, h.ess * 3 - cashAssets()))} short of that floor.`]);
  }

  const worst = allDebts().filter(d => d.balance > 0).sort((a, b) => b.apr - a.apr)[0];
  if (worst && worst.apr >= 8) {
    const annualInterest = worst.balance * worst.apr / 100;
    out.push(['crit', `${worst.name} costs ${money(annualInterest)} a year in interest`,
      `At ${worst.apr}% on ${money(worst.balance)}. Clearing it is a guaranteed ${worst.apr}% return - higher than the ${S.settings.expectedReturn}% you are assuming for investments.`]);
  }

  if (surplus > 50) {
    const fv = futureValue(surplus, 20, S.settings.expectedReturn);
    out.push(['good', `${money(surplus)}/mo is currently unallocated`,
      `Invested consistently at ${S.settings.expectedReturn}% that becomes about ${compact(fv)} in 20 years, of which ${compact(fv - surplus * 240)} is growth rather than contribution.`]);
  }

  // per-member fairness: spending share vs income share
  if (S.members.length > 1) {
    const totalInc = sum(S.members.map(m2 => +m2.annualIncome || 0));
    const spendTotal = sum(Object.values(st.byMember));
    if (totalInc > 0 && spendTotal > 0) {
      for (const mem of S.members) {
        // only compare earners - a dependant spending more than they earn is
        // the normal state of a child, not a finding
        if ((+mem.annualIncome || 0) <= 0) continue;
        const sShare = ((st.byMember[mem.id] || 0) / spendTotal) * 100;
        const iShare = ((+mem.annualIncome || 0) / totalInc) * 100;
        if (sShare - iShare > 22 && (st.byMember[mem.id] || 0) > 400) {
          out.push(['warn', `${mem.name} accounts for ${pct(sShare)} of spending`,
            `Against ${pct(iShare)} of household income. Not automatically a problem - shared bills often sit on one card - but worth confirming the split is intentional.`]);
        }
      }
    }
  }

  const order = { crit: 0, warn: 1, good: 2 };
  return out.map(([tone, title, text]) => ({ tone, title, text }))
    .sort((a, b) => order[a.tone] - order[b.tone]);
}

/* ------------------------------------------------------------- simulator --- */

/**
 * "What if we trimmed discretionary spending by N%?" - the single most
 * actionable lever, expressed as a long-run wealth figure.
 */
function trimSim(pctCut) {
  const months = activeMonths().slice(-3);
  const wants = months.length
    ? sum(months.map(m => monthStats(m, 'all').wants)) / months.length : 0;
  const freed = wants * (pctCut / 100);
  const surplus = investableSurplus().free;
  const total = freed + surplus;
  const r = S.settings.expectedReturn;
  return {
    wants, freed, surplus, total,
    y5: futureValue(total, 5, r), y10: futureValue(total, 10, r),
    y20: futureValue(total, 20, r), y30: futureValue(total, 30, r),
    contributed30: total * 360
  };
}

</script>
<script>
/* ===== credit.js ===== */
/* ==========================================================================
   Credit cards: utilisation, payment timing, scoring factors, rewards.

   The score here is a MODEL of the published FICO factor weights applied to
   the card data you enter. It is not your score and cannot be - the bureaus
   hold data this app never sees. It is useful for the same reason a budget is
   useful: it shows which lever has the most slack. Real scores are free from
   most card issuers and from annualcreditreport.com.
   ========================================================================== */
'use strict';

/* ------------------------------------------------------------------ basics */

const activeCards = () => (S.cards || []).filter(c => c.active !== false);

/** What the issuer reports to the bureaus is the statement balance, not today's. */
function reportedBalance(c) {
  const s = c.statementBalance;
  return (s === null || s === undefined || s === '') ? (+c.balance || 0) : (+s || 0);
}
const cardUtil = c => (+c.limit > 0 ? (reportedBalance(c) / +c.limit) * 100 : 0);
const liveUtil = c => (+c.limit > 0 ? ((+c.balance || 0) / +c.limit) * 100 : 0);

const totalLimit = () => sum(activeCards().map(c => +c.limit || 0));
const totalReported = () => sum(activeCards().map(reportedBalance));
const totalCardBalance = () => sum(activeCards().map(c => +c.balance || 0));
const aggregateUtil = () => (totalLimit() > 0 ? (totalReported() / totalLimit()) * 100 : 0);

/** Every revolving and installment obligation in one shape, for the payoff engine. */
function allDebts() {
  const cards = activeCards()
    .filter(c => (+c.balance || 0) > 0)
    .map(c => ({ name: c.name, balance: +c.balance || 0, apr: +c.apr || 0,
                 minPayment: +c.minPayment || 0, kind: 'card' }));
  const loans = (S.debts || [])
    .filter(d => (+d.balance || 0) > 0)
    .map(d => ({ name: d.name, balance: +d.balance || 0, apr: +d.apr || 0,
                 minPayment: +d.minPayment || 0, kind: 'loan' }));
  return [...cards, ...loans];
}

/* ------------------------------------------------------------------- dates */

function monthsSince(v) {
  if (!v) return null;
  const s = String(v);
  const y = +s.slice(0, 4), mo = +s.slice(5, 7) || 1;
  if (!y) return null;
  const now = new Date();
  return (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - mo);
}
const yearsText = mo => mo == null ? '-'
  : mo < 12 ? `${mo} mo` : `${(mo / 12).toFixed(1)} yr`;

/** Next calendar occurrence of a day-of-month, as an ISO date. */
function nextDayOfMonth(day) {
  if (!day) return null;
  const now = new Date();
  const d = Math.min(+day, 28);
  let dt = new Date(now.getFullYear(), now.getMonth(), d);
  if (dt < new Date(now.getFullYear(), now.getMonth(), now.getDate())) {
    dt = new Date(now.getFullYear(), now.getMonth() + 1, d);
  }
  return dt.toISOString().slice(0, 10);
}
const daysUntil = iso => {
  if (!iso) return null;
  const a = new Date(todayISO() + 'T00:00:00'), b = new Date(iso + 'T00:00:00');
  return Math.round((b - a) / 86400000);
};

/**
 * The single most misunderstood piece of card mechanics: the balance that
 * lands on your credit report is whatever is sitting there when the statement
 * closes, which is roughly three weeks BEFORE the payment is due.
 */
function cardTiming(c) {
  const close = nextDayOfMonth(c.statementDay);
  const due = nextDayOfMonth(c.dueDay);
  return {
    close, due,
    daysToClose: daysUntil(close),
    daysToDue: daysUntil(due)
  };
}

/* --------------------------------------------------------- payment history */

/** On-time run length, plus any lates recent enough to still be scored. */
function paymentRecord() {
  const pays = [...(S.cardPayments || [])].sort((a, b) => b.date.localeCompare(a.date));
  const lates = pays.filter(p => p.onTime === false);
  let streak = 0;
  for (const p of pays) { if (p.onTime === false) break; streak++; }
  const recentLate = lates.filter(p => (monthsSince(p.date) || 99) <= 24);
  const autopayOff = activeCards().filter(c => !c.autopay || c.autopay === 'none');
  return { pays, lates, streak, recentLate, autopayOff, total: pays.length };
}

/* ------------------------------------------------------------ score factors */

/** Utilisation is scored on the aggregate AND on the worst individual card. */
function utilisationScore() {
  const agg = aggregateUtil();
  const cards = activeCards().filter(c => +c.limit > 0);
  const worst = cards.length ? Math.max(...cards.map(cardUtil)) : 0;
  const zeroAll = cards.length > 0 && totalReported() === 0;

  // piecewise, mirroring the published utilisation bands
  let s;
  if (agg <= 1) s = 100;
  else if (agg <= 9) s = 96;
  else if (agg <= 19) s = 88;
  else if (agg <= 29) s = 76;
  else if (agg <= 49) s = 55;
  else if (agg <= 74) s = 32;
  else if (agg <= 94) s = 14;
  else s = 4;

  // a single card sitting high is scored on its own, even with a low aggregate
  let penalty = 0;
  if (worst > 90) penalty = 16;
  else if (worst > 70) penalty = 12;
  else if (worst > 50) penalty = 8;
  else if (worst > 30) penalty = 4;

  // every card reporting zero looks thin rather than excellent
  if (zeroAll) s = 92;

  return { score: clamp(s - penalty, 0, 100), agg, worst, zeroAll, cards: cards.length };
}

function historyScore() {
  const dates = activeCards().map(c => monthsSince(c.openedDate)).filter(x => x != null);
  const manual = monthsSince((S.creditProfile || {}).oldestAccount);
  if (!dates.length && manual == null) return { score: null, avg: null, oldest: null };
  const oldest = Math.max(...(dates.length ? dates : [0]), manual || 0);
  const avg = dates.length ? sum(dates) / dates.length : oldest;
  // oldest account carries more weight than the average
  const sOld = clamp((oldest / 108) * 100, 0, 100);      // 9 years for full marks
  const sAvg = clamp((avg / 84) * 100, 0, 100);          // 7 years for full marks
  return { score: sOld * 0.6 + sAvg * 0.4, avg, oldest };
}

function mixScore() {
  const rev = activeCards().length > 0;
  const inst = (S.debts || []).some(d => (+d.balance || 0) > 0);
  const score = rev && inst ? 100 : (rev || inst) ? 62 : 0;
  return { score, rev, inst };
}

function newCreditScore() {
  const p = S.creditProfile || {};
  const inq = (p.inquiries || []).filter(i => (monthsSince(i.date) || 99) < 12);
  const opened = activeCards().filter(c => (monthsSince(c.openedDate) || 99) < 12);
  let s = 100 - inq.length * 13 - opened.length * 6;
  return { score: clamp(s, 15, 100), inquiries: inq, opened };
}

function paymentScore() {
  const r = paymentRecord();
  if (!r.total && !r.lates.length) return { score: null, ...r };   // nothing logged yet
  let s = 100;
  for (const p of r.lates) {
    const age = monthsSince(p.date) || 99;
    s -= age <= 6 ? 38 : age <= 12 ? 28 : age <= 24 ? 18 : 7;
  }
  if (r.streak >= 24) s = Math.min(100, s + 4);
  return { score: clamp(s, 0, 100), ...r };
}

/**
 * Weighted model of the published FICO factor weights. Unknown factors are
 * dropped and the remaining weights renormalised, and the reported band widens
 * to reflect how much was actually known.
 */
function creditScore() {
  const util = utilisationScore();
  const hist = historyScore();
  const mix = mixScore();
  const nu = newCreditScore();
  const pay = paymentScore();

  const factors = [
    { key: 'payment', name: 'Payment history', weight: 35, score: pay.score, data: pay,
      why: 'Whether you pay on time. The heaviest factor, and the one a single miss damages most.' },
    { key: 'util', name: 'Credit utilisation', weight: 30, score: util.score, data: util,
      why: 'Reported balances against your limits. The fastest factor to move - it resets every month.' },
    { key: 'history', name: 'Length of history', weight: 15, score: hist.score, data: hist,
      why: 'Age of your oldest card and the average across all of them. Only time fixes this, so protect it.' },
    { key: 'mix', name: 'Credit mix', weight: 10, score: mix.score, data: mix,
      why: 'Having both revolving credit (cards) and instalment credit (loans) on file.' },
    { key: 'new', name: 'New credit', weight: 10, score: nu.score, data: nu,
      why: 'Recent hard inquiries and newly opened accounts. Fades after 12 months.' }
  ];

  const known = factors.filter(f => f.score != null);
  const wsum = sum(known.map(f => f.weight));
  const norm = wsum > 0 ? sum(known.map(f => f.score * f.weight)) / wsum : 0;

  // 300-850 is the common consumer range
  const estimate = Math.round(300 + (norm / 100) * 550);

  // confidence: how much of the model's weight rested on real data
  const coverage = wsum / 100;
  const hasLimits = activeCards().every(c => +c.limit > 0);
  const hasDates = activeCards().every(c => c.openedDate);
  let band = 30;
  if (coverage < 1) band += 25;
  if (!hasLimits) band += 20;
  if (!hasDates) band += 15;
  if (!activeCards().length) band += 40;

  const label = estimate >= 800 ? 'Exceptional' : estimate >= 740 ? 'Very good'
    : estimate >= 670 ? 'Good' : estimate >= 580 ? 'Fair' : 'Poor';
  const tone = estimate >= 740 ? 'good' : estimate >= 670 ? 'good'
    : estimate >= 580 ? 'warn' : 'crit';

  return {
    estimate, low: Math.max(300, estimate - band), high: Math.min(850, estimate + band),
    factors, label, tone, coverage, band,
    reported: (S.creditProfile || {}).reportedScore || null
  };
}

/** Points still available in each factor, biggest opportunity first. */
function scoreHeadroom() {
  const cs = creditScore();
  return cs.factors
    .filter(f => f.score != null)
    .map(f => ({ ...f, gap: ((100 - f.score) / 100) * f.weight * 5.5 }))
    .sort((a, b) => b.gap - a.gap);
}

/* ------------------------------------------------------- utilisation moves */

/**
 * What the aggregate becomes if `amount` is paid down before statement close.
 * This is the concrete version of "pay early, not just on time".
 */
function utilAfterPayment(amount, cardId) {
  const lim = totalLimit();
  // no limits recorded means no ratio to report - return zeroes rather than null
  // so callers never have to null-check a shape they use for display
  if (!lim) return { before: 0, after: 0, cardAfter: null, noLimits: true };
  let bal = totalReported();
  bal = Math.max(0, bal - amount);
  const after = (bal / lim) * 100;
  const card = cardId ? activeCards().find(c => c.id === cardId) : null;
  const cardAfter = card && +card.limit > 0
    ? clamp((reportedBalance(card) - amount) / +card.limit * 100, 0, 999) : null;
  return { before: aggregateUtil(), after, cardAfter };
}

/** Amount needed to bring the aggregate down to a target percentage. */
function payToReach(targetPct) {
  const lim = totalLimit();
  if (!lim) return 0;
  return Math.max(0, totalReported() - (targetPct / 100) * lim);
}

/** Effect of closing a card: limit drops, so utilisation on what is left rises. */
function closeImpact(cardId) {
  const c = activeCards().find(x => x.id === cardId);
  if (!c) return null;
  const rest = activeCards().filter(x => x.id !== cardId);
  // Closing an account removes its limit from the calculation but NOT the debt:
  // you still owe whatever is on it. Dropping the balance too would make closing
  // a carried-balance card look like an improvement, which is backwards.
  const lim = sum(rest.map(x => +x.limit || 0));
  const bal = totalReported();
  const age = monthsSince(c.openedDate);
  const ages = activeCards().map(x => monthsSince(x.openedDate)).filter(x => x != null);
  const restAges = rest.map(x => monthsSince(x.openedDate)).filter(x => x != null);
  return {
    card: c,
    utilBefore: aggregateUtil(),
    utilAfter: lim > 0 ? (bal / lim) * 100 : 100,
    limitLost: +c.limit || 0,
    isOldest: age != null && ages.length > 0 && age === Math.max(...ages),
    avgAgeBefore: ages.length ? sum(ages) / ages.length : null,
    avgAgeAfter: restAges.length ? sum(restAges) / restAges.length : null
  };
}

/* ------------------------------------------------------------ interest cost */

/** Monthly interest on cards actually carrying a balance. */
function cardInterestMonthly() {
  return sum(activeCards()
    .filter(c => c.paysInFull === false && (+c.balance || 0) > 0)
    .map(c => (+c.balance || 0) * (+c.apr || 0) / 100 / 12));
}

/** Interest and fees the ledger has actually recorded, annualised. */
function observedInterest() {
  const ms = activeMonths().slice(-6);
  if (!ms.length) return 0;
  return sum(ms.map(m => monthStats(m, 'all').byCat.fees || 0)) / ms.length;
}

/* ----------------------------------------------------------------- rewards */

/** Earn rate for a category, falling back to the card's catch-all rate. */
function rewardRate(card, cat) {
  const rs = card.rewards || [];
  const hit = rs.find(r => r.cat === cat);
  if (hit) return +hit.rate || 0;
  const any = rs.find(r => r.cat === '*');
  return any ? (+any.rate || 0) : 0;
}

/**
 * Categories that can realistically go on a card at face value. Rent, loan
 * payments and insurance are excluded: they are usually ACH-only, or carry a
 * processing fee that swallows any reward. Recommending them would be wrong
 * advice dressed up as a number.
 */
const CARDABLE = new Set(['groceries', 'dining', 'transport', 'travel', 'shopping',
  'fun', 'subs', 'personal', 'health', 'utilities', 'gifts']);

/**
 * Which card should be used where, based on the household's real category
 * spending. Compares what is being earned now against the best available.
 */
function rewardsAnalysis() {
  const cards = activeCards();
  if (!cards.length) return { rows: [], current: 0, best: 0, gain: 0, fees: 0 };

  const ms = activeMonths().slice(-3);
  const annual = {};
  for (const c of CATS) {
    if (!CARDABLE.has(c.id)) continue;
    const avg = ms.length
      ? sum(ms.map(m => monthStats(m, 'all').byCat[c.id] || 0)) / ms.length : 0;
    if (avg > 0) annual[c.id] = avg * 12;
  }

  // where each category's spend currently lands, via the account -> card link
  const cardByAccount = {};
  for (const c of cards) if (c.account) cardByAccount[c.account] = c;

  const payInFull = cards.filter(c => c.paysInFull !== false);
  const carrying = cards.filter(c => c.paysInFull === false);

  const rows = [];
  let current = 0, best = 0;
  for (const [cat, spend] of Object.entries(annual)) {
    // current earn: weight by which account each transaction actually used
    let curEarn = 0, tot = 0;
    for (const m of ms) {
      for (const t of S.txns) {
        if (ym(t.date) !== m || t.cat !== cat || t.amount >= 0) continue;
        const amt = -t.amount; tot += amt;
        const card = cardByAccount[t.account];
        curEarn += amt * (card ? rewardRate(card, cat) : 0) / 100;
      }
    }
    const curRate = tot > 0 ? (curEarn / tot) * 100 : 0;
    // Only ever recommend routing spend to a card that is cleared every month.
    // No reward rate survives an interest charge, so steering spend onto a card
    // carrying a balance would be advice that loses money.
    const rank = list => list.map(c => ({ c, rate: rewardRate(c, cat) })).sort((a, b) => b.rate - a.rate);
    const top = (payInFull.length ? rank(payInFull) : rank(cards))[0];
    const curVal = spend * curRate / 100;
    const bestVal = spend * top.rate / 100;
    current += curVal; best += bestVal;
    rows.push({
      cat, spend, curRate, bestCard: top.c, bestRate: top.rate,
      curVal, bestVal, gain: bestVal - curVal,
      alreadyBest: bestVal - curVal < 1
    });
  }
  rows.sort((a, b) => b.gain - a.gain);
  const fees = sum(cards.map(c => +c.annualFee || 0));
  return {
    rows, current, best, gain: best - current, fees,
    // surfaced in the UI so the exclusion is visible rather than silent
    excluded: carrying, noneClear: payInFull.length === 0
  };
}

/** Annual fee against the rewards that card is actually earning. */
function feeAnalysis() {
  const ra = rewardsAnalysis();
  return activeCards().filter(c => (+c.annualFee || 0) > 0).map(c => {
    const earned = sum(ra.rows.filter(r => r.bestCard.id === c.id).map(r => r.bestVal));
    return { card: c, fee: +c.annualFee, earned, net: earned - (+c.annualFee) };
  });
}

/* ----------------------------------------------------------- due schedule  */

function upcomingPayments(days = 45) {
  return activeCards()
    .map(c => {
      const t = cardTiming(c);
      const due = reportedBalance(c) > 0 ? reportedBalance(c) : (+c.balance || 0);
      return {
        card: c, ...t,
        amountFull: due,
        amountMin: +c.minPayment || 0,
        autopay: c.autopay || 'none'
      };
    })
    // a card with nothing owed has nothing due - showing it as a $0 payment is noise
    .filter(x => x.daysToDue != null && x.daysToDue <= days && (x.amountFull > 0 || x.amountMin > 0))
    .sort((a, b) => a.daysToDue - b.daysToDue);
}

/* ------------------------------------------------------- credit insights   */

/** The actionable list. Ordered by how much it actually moves the needle. */
function creditInsights() {
  const out = [];
  const cs = creditScore();
  const util = utilisationScore();
  const pay = paymentRecord();
  const cards = activeCards();
  if (!cards.length) return out;

  const add = (tone, title, text) => out.push({ tone, title, text });

  // ---- payment history first: it is the heaviest and the most damaging to lose
  if (pay.autopayOff.length) {
    add('crit', `${pay.autopayOff.length} card${pay.autopayOff.length === 1 ? ' has' : 's have'} no autopay set`,
      `A single payment 30 days late can cost a large number of points and stays on the report for seven years. ` +
      `Setting autopay for at least the minimum on ${pay.autopayOff.map(c => c.name).join(', ')} removes that risk entirely; ` +
      `you can still pay more by hand.`);
  }
  if (pay.recentLate.length) {
    add('crit', `${plural(pay.recentLate.length, 'late payment')} in the last 24 months`,
      `Recent lates weigh more than old ones and their effect fades with time. Consistent on-time payments from here ` +
      `are the only fix; a goodwill adjustment request to the issuer is sometimes granted for an isolated miss.`);
  } else if (pay.streak >= 6) {
    add('good', `${pay.streak} on-time payments logged in a row`,
      `Payment history is 35% of the model - the largest single factor. Keeping this unbroken matters more than any other habit here.`);
  }

  // ---- utilisation: the fastest lever, because it resets every statement
  const over30 = cards.filter(c => cardUtil(c) > 30).sort((a, b) => cardUtil(b) - cardUtil(a));
  if (util.agg > 30) {
    const need = payToReach(29);
    add('crit', `Overall utilisation is ${pct(util.agg, 1)}`,
      `Above the 30% mark that scoring models treat as a threshold. Paying ${money(need)} across your cards before ` +
      `their statements close would report under 29% instead. Under 10% is where the factor stops costing you anything.`);
  } else if (util.agg > 10) {
    const need = payToReach(9);
    add('warn', `Overall utilisation is ${pct(util.agg, 1)}`,
      `Comfortably under 30%, but the top band is under 10%. Paying about ${money(need)} before statement close ` +
      `would get you there. Utilisation carries no memory - it is recalculated from scratch every month.`);
  } else if (util.cards) {
    add('good', `Overall utilisation is ${pct(util.agg, 1)}`,
      `In the strongest band. Utilisation is 30% of the model and the only heavy factor you can change in a single month.`);
  }

  for (const c of over30.slice(0, 3)) {
    if (util.agg <= 30 || cardUtil(c) > 60) {
      const need = reportedBalance(c) - 0.29 * (+c.limit || 0);
      add(cardUtil(c) > 70 ? 'crit' : 'warn',
        `${c.name} is at ${pct(cardUtil(c), 0)} of its limit`,
        `Individual cards are scored on their own as well as in aggregate, so one high card costs points even when ` +
        `your total looks fine. Paying ${money(Math.max(0, need))} on this card before it reports would bring it under 30%.`);
    }
  }

  // ---- the timing lever most people never hear about
  const soon = cards.map(c => ({ c, t: cardTiming(c) }))
    .filter(x => x.t.daysToClose != null && x.t.daysToClose <= 7 && reportedBalance(x.c) > 0)
    .sort((a, b) => a.t.daysToClose - b.t.daysToClose);
  if (soon.length) {
    const x = soon[0];
    add('warn', `${x.c.name} reports its balance in ${plural(x.t.daysToClose, 'day')}`,
      `The balance sent to the bureaus is whatever sits on the card when the statement closes on the ${x.c.statementDay}${ordinal(x.c.statementDay)} - ` +
      `not what is left after you pay on the ${x.c.dueDay}${ordinal(x.c.dueDay)}. Paying before the close date is what lowers reported utilisation. ` +
      `Paying by the due date only protects your payment history.`);
  }

  // ---- interest: money leaving for nothing
  const carrying = cards.filter(c => c.paysInFull === false && (+c.balance || 0) > 0);
  if (carrying.length) {
    const mo = cardInterestMonthly();
    const worst = [...carrying].sort((a, b) => (+b.apr) - (+a.apr))[0];
    add('crit', `Carrying a balance costs about ${money(mo)} a month in interest`,
      `${money(mo * 12)} a year on ${plural(carrying.length, 'card')}. ` +
      `${worst.name} at ${worst.apr}% is the most expensive. Carrying a balance does not help your score - ` +
      `that is a persistent myth. Paying the statement balance in full each month reports the same activity with zero interest.`);
  }

  // ---- length of history: irreversible, so guard it
  const h = historyScore();
  if (h.oldest != null) {
    const oldestCard = cards.filter(c => monthsSince(c.openedDate) === h.oldest)[0];
    if (h.oldest < 36) {
      add('warn', `Your credit history is ${yearsText(h.oldest)} old`,
        `Length of history is 15% of the model and only time improves it. Keep your oldest card open and use it ` +
        `occasionally - issuers close inactive accounts, and that would reset the clock you have already run.`);
    } else if (oldestCard) {
      add('good', `${oldestCard.name} is your oldest account at ${yearsText(h.oldest)}`,
        `Keep it open. Closing your oldest card eventually shortens your average age and removes its limit from the ` +
        `utilisation calculation - two factors damaged by one action.`);
    }
  }

  // ---- new credit
  const nu = newCreditScore();
  if (nu.inquiries.length >= 2) {
    add('warn', `${nu.inquiries.length} hard inquiries in the last 12 months`,
      `Each typically costs a few points. They stop affecting the score after 12 months and drop off the report at 24. ` +
      `Spacing applications out, and checking for pre-qualification offers that use a soft pull, avoids stacking them.`);
  }

  // ---- limit increases: raises the denominator without spending anything
  if (util.agg > 15 && pay.recentLate.length === 0 && cards.length) {
    const newLimit = totalLimit() * 1.25;
    const after = (totalReported() / newLimit) * 100;
    add('good', 'A credit limit increase would lower utilisation without paying anything',
      `Utilisation is a ratio, so raising the limit works as well as lowering the balance. A 25% increase across your ` +
      `cards would move you from ${pct(util.agg, 1)} to about ${pct(after, 1)}. Ask whether the issuer uses a soft pull first - ` +
      `many do, and a soft pull costs nothing.`);
  }

  // ---- fees vs rewards
  for (const f of feeAnalysis()) {
    if (f.net < 0) {
      add('warn', `${f.card.name}'s ${money(f.fee)} fee exceeds what it earns you`,
        `About ${money(f.earned)} of rewards a year against a ${money(f.fee)} fee - a net ${money(f.net)}. ` +
        `Before closing it, ask the issuer to switch you to a no-fee version of the same account: that keeps the ` +
        `age and the limit on your report, which closing would cost you.`);
    }
  }

  // ---- rewards routing
  const ra = rewardsAnalysis();
  if (ra.gain > 60) {
    const top = ra.rows[0];
    add('good', `About ${money(ra.gain)} a year in rewards is being left on the table`,
      `Your biggest single gap is ${catName(top.cat)}: ${money(top.spend)} a year currently earning ${pct(top.curRate, 1)} ` +
      `when ${top.bestCard.name} pays ${pct(top.bestRate, 1)}. Rewards are worth chasing only once the balance is paid in ` +
      `full every month - no cashback rate beats a 20%+ interest charge.`);
  }

  const order = { crit: 0, warn: 1, good: 2 };
  return out.sort((a, b) => order[a.tone] - order[b.tone]);
}

function ordinal(n) {
  n = +n; if (!n) return '';
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return s[(v - 20) % 10] || s[v] || s[0];
}
